                      ExpressionAttributeValues={':email': email}
                  )
                  
                  if not user_response['Items']:
                      return response_with_cors(404, {'error': 'User with this email does not exist'})
                  
                  user_data = user_response['Items'][0]
                  
                  if not user_data.get('isActive', False):
                      return response_with_cors(400, {'error': 'User account is inactive'})
                  
                  if user_data.get('verificationStatus') != 'verified':
                      return response_with_cors(400, {'error': 'Email not verified. Please verify your email first.'})
                  
                  otp = generate_otp()
                  session_id = str(uuid.uuid4())
                  
                  otp_table = dynamodb.Table(os.environ['SECURITY_QUESTION_OTP_TABLE'])
                  otp_table.put_item(
                      Item={
                          'sessionId': session_id,
                          'email': email,
                          'userId': user_data['userId'],
                          'otp': otp,
                          'status': 'pending',
                          'attempts': 0,
                          'maxAttempts': 3,
                          'createdAt': datetime.now().isoformat(),
                          'expiresAt': int((datetime.now() + timedelta(minutes=10)).timestamp())
                      }
                  )
                  
                  send_security_otp_email(user_data, otp, session_id)
                  
                  print(f"Security answer access OTP sent for: {email}")
                  return response_with_cors(200, {
                      'message': 'OTP sent to your email for security question access.',
                      'sessionId': session_id,
                      'email': email,
                      'expiresInMinutes': 10,
                      'maxAttempts': 3,
                      'nextStep': 'Please check your email for the OTP code.'
                  })
                  
              except Exception as e:
                  print(f"Initiate security answer access error: {str(e)}")
                  import traceback
                  print(f"Traceback: {traceback.format_exc()}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
          def generate_otp():
              """Generate a 6-digit OTP"""
              return str(random.randint(100000, 999999))
          
          def send_security_otp_email(user_data, otp, session_id):
              try:
                  user_topic_arn = user_data.get('notificationTopicArn')
                  
                  if not user_topic_arn:
                      print(f"No personal topic found for user: {user_data['userId']}")
                      return
                  
                  email_subject = "DALScooter - Security Question Access OTP"
                  email_message = f"""
          Dear DALScooter User,
          
          You have requested access to your security question answer. Please use the following OTP to verify your identity:
          
          OTP Code: {otp}
          
          This code is valid for 10 minutes only and can be used up to 3 times.
          
          If you did not request this access, please ignore this email or contact support.
          
          Session ID: {session_id}
          
          Best regards,
          DALScooter Security Team
                  """
                  
                  sns.publish(
                      TopicArn=user_topic_arn,
                      Message=email_message,
                      Subject=email_subject
                  )
                  
                  general_topic_arn = os.environ.get('SECURITY_QUESTION_OTP_TOPIC_ARN', '')
                  if general_topic_arn:
                      log_message = {
                          'email': user_data['email'],
                          'userId': user_data['userId'],
                          'sessionId': session_id,
                          'timestamp': datetime.now().isoformat(),
                          'event': 'security_question_otp_sent',
                          'otp': otp  
                      }
                      
                      sns.publish(
                          TopicArn=general_topic_arn,
                          Message=json.dumps(log_message),
                          Subject=f'DALScooter Security OTP Sent - {user_data["email"]}'
                      )
                  
                  print(f"Security OTP email sent for user: {user_data['userId']}")
                  
              except Exception as e:
                  print(f"Error sending security OTP email: {str(e)}")
          
          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'POST,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body)
              }

  ValidateOtpForSecurityAccessFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-ValidateOtpForSecurityAccess-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SECURITY_QUESTION_OTP_TABLE: !Ref SecurityQuestionOtpTable
          SECURE_ANSWER_ACCESS_TABLE: !Ref SecureAnswerAccessTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import uuid
          from datetime import datetime, timedelta
          
          dynamodb = boto3.resource('dynamodb')
          
          def lambda_handler(event, context):
              print(f"Validate OTP for security access event: {json.dumps(event)}")
              
              try:
                  if 'body' in event:
                      body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
                  else:
                      body = event
                  
                  email = body.get('email', '').strip().lower()
                  verification_code = body.get('verificationCode', '').strip()
                  session_id = body.get('sessionId', '')
                  
                  if not all([email, verification_code, session_id]):
                      return response_with_cors(400, {
                          'error': 'Email, verification code, and session ID are required'
                      })
                  
                  # Validate OTP format (6 digits)
                  if not verification_code.isdigit() or len(verification_code) != 6:
                      return response_with_cors(400, {'error': 'Invalid OTP format. Must be 6 digits.'})
                  
                  # Retrieve OTP session
                  otp_table = dynamodb.Table(os.environ['SECURITY_QUESTION_OTP_TABLE'])
                  otp_response = otp_table.get_item(Key={'sessionId': session_id})
                  
                  if 'Item' not in otp_response:
                      return response_with_cors(400, {'error': 'Invalid or expired OTP session'})
                  
                  otp_data = otp_response['Item']
                  
                  # Validate session belongs to the email
                  if otp_data['email'] != email:
                      return response_with_cors(400, {'error': 'Invalid session for this email'})
                  
                  # Check if session is still valid (not expired or used)
                  if otp_data.get('status') != 'pending':
                      return response_with_cors(400, {'error': 'OTP session has been used or expired'})
                  
                  # Check attempts
                  current_attempts = otp_data.get('attempts', 0)
                  max_attempts = otp_data.get('maxAttempts', 3)
                  
                  if current_attempts >= max_attempts:
                      otp_table.update_item(
                          Key={'sessionId': session_id},
                          UpdateExpression='SET #status = :status',
                          ExpressionAttributeNames={'#status': 'status'},
                          ExpressionAttributeValues={':status': 'failed'}
                      )
                      return response_with_cors(400, {'error': 'Maximum OTP attempts exceeded. Please request a new OTP.'})
                  
                  # Validate the actual OTP
                  stored_otp = otp_data.get('otp', '')
                  
                  if verification_code != stored_otp:
                      # Increment attempts
                      otp_table.update_item(
                          Key={'sessionId': session_id},
                          UpdateExpression='SET attempts = attempts + :inc',
                          ExpressionAttributeValues={':inc': 1}
                      )
                      
                      remaining_attempts = max_attempts - (current_attempts + 1)
                      return response_with_cors(400, {
                          'error': f'Invalid OTP. {remaining_attempts} attempts remaining.'
                      })
                  
                  access_id = str(uuid.uuid4())
                  access_table = dynamodb.Table(os.environ['SECURE_ANSWER_ACCESS_TABLE'])
                  access_table.put_item(
                      Item={
                          'accessId': access_id,
                          'email': email,
                          'userId': otp_data['userId'],
                          'originalSessionId': session_id,
                          'verifiedAt': datetime.now().isoformat(),
                          'expiresAt': int((datetime.now() + timedelta(minutes=5)).timestamp()), # Short-lived access
                          'validationMethod': 'otp_verified'
                      }
                  )
                  
                  # Mark OTP session as used
                  otp_table.update_item(
                      Key={'sessionId': session_id},
                      UpdateExpression='SET #status = :status, usedAt = :used',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'used',
                          ':used': datetime.now().isoformat()
                      }
                  )
                  
                  print(f"OTP validation successful for security access: {email}")
                  return response_with_cors(200, {
                      'message': 'OTP verified successfully. You can now access your security question answer.',
                      'verified': True,
                      'accessId': access_id,
                      'expiresInMinutes': 5,
                      'note': 'Access granted for 5 minutes. Use the access ID to retrieve your security answer.'
                  })
                  
              except Exception as e:
                  print(f"Validate OTP for security access error: {str(e)}")
                  import traceback
                  print(f"Traceback: {traceback.format_exc()}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'POST,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body)
              }

  GetSecurityAnswerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-GetSecurityAnswer-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SECURITY_QUESTIONS_TABLE: !Ref SecurityQuestionsTable
          SECURE_ANSWER_ACCESS_TABLE: !Ref SecureAnswerAccessTable
      Code:
        ZipFile: |
          import json
          import boto3
          import hashlib
          import os
          import base64
          from datetime import datetime
          
          dynamodb = boto3.resource('dynamodb')
          
          def lambda_handler(event, context):
              print(f"Get security answer event: {json.dumps(event)}")
              
              try:
                  if 'body' in event:
                      body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
                  else:
                      body = event
                  
                  access_id = body.get('accessId', '')
                  
                  if not access_id:
                      return response_with_cors(400, {
                          'error': 'Access ID is required'
                      })
                  
                  # Verify the access record
                  access_table = dynamodb.Table(os.environ['SECURE_ANSWER_ACCESS_TABLE'])
                  access_response = access_table.get_item(Key={'accessId': access_id})
                  
                  if 'Item' not in access_response:
                      return response_with_cors(400, {'error': 'Invalid or expired access session'})
                  
                  access_data = access_response['Item']
                  email = access_data['email']
                  
                  # Check if access has been used before
                  if 'usedAt' in access_data:
                      return response_with_cors(400, {'error': 'Access session already used. Please re-verify.'})
                  
                  # Get user information
                  users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                  user_response = users_table.scan(
                      FilterExpression='email = :email',
                      ExpressionAttributeValues={':email': email}
                  )
                  
                  if not user_response['Items']:
                      return response_with_cors(404, {'error': 'User not found'})
                  
                  user_data = user_response['Items'][0]
                  user_id = user_data['userId']
                  
                  # Get security question data
                  security_table = dynamodb.Table(os.environ['SECURITY_QUESTIONS_TABLE'])
                  security_response = security_table.get_item(Key={'userId': user_id})
                  
                  if 'Item' not in security_response:
                      return response_with_cors(404, {'error': 'Security question data not found'})
                  
                  security_data = security_response['Item']
                  
                  # Decrypt the security answer
                  encrypted_answer = security_data.get('encryptedAnswer', '')
                  if not encrypted_answer:
                      return response_with_cors(404, {'error': 'Security answer not found or not retrievable'})
                  
                  decrypted_answer = decrypt_security_answer(encrypted_answer, user_id)
                  
                  access_table.update_item(
                      Key={'accessId': access_id},
                      UpdateExpression='SET usedAt = :used',
                      ExpressionAttributeValues={
                          ':used': datetime.now().isoformat()
                      }
                  )
                  
                  print(f"Security answer retrieved successfully for user: {user_id}")
                  return response_with_cors(200, {
                      'message': 'Security answer retrieved successfully.',
                      'userId': user_id,
                      'email': email,
                      'securityQuestion': security_data['securityQuestion'],
                      'securityAnswer': decrypted_answer,
                      'verificationMethod': 'otp_verified',
                      'note': 'Your security question answer has been retrieved. This access token has been consumed.'
                  })
                  
              except Exception as e:
                  print(f"Get security answer error: {str(e)}")
                  import traceback
                  print(f"Traceback: {traceback.format_exc()}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
          def decrypt_security_answer(encrypted_answer, user_id):
              """Decrypt the security answer using the reverse of the encryption method"""
              try:
                  # Decode from base64
                  encrypted_bytes = base64.b64decode(encrypted_answer.encode('utf-8'))
                  encrypted_string = encrypted_bytes.decode('latin-1')
                  
                  # Use user_id as key for decryption (same as encryption)
                  key = hashlib.md5(user_id.encode()).hexdigest()
                  
                  decrypted = ""
                  for i, char in enumerate(encrypted_string):
                      key_char = key[i % len(key)]
                      decrypted += chr(ord(char) ^ ord(key_char))
                  
                  return decrypted
                  
              except Exception as e:
                  print(f"Decryption error: {str(e)}")
                  try:
                      return base64.b64decode(encrypted_answer.encode('utf-8')).decode('utf-8')
                  except:
                      return "Unable to decrypt answer"
          
          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'POST,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body)
              }

