AWSTemplateFormatVersion: '2010-09-09'

Description: 'DALScooter User Management, Authentication & Notification System with Email Verification and Password Reset'

Parameters:
  ProjectName:
    Type: String
    Default: 'DALScooter'
    Description: 'Project name for resource naming'
  
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues:
      - dev
      - prod
    Description: 'Environment name'

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Users-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: userType
          AttributeType: S
        - AttributeName: verificationStatus
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserTypeIndex
          KeySchema:
            - AttributeName: userType
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: VerificationStatusIndex
          KeySchema:
            - AttributeName: verificationStatus
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Module
          Value: UserManagement

  SecurityQuestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-SecurityQuestions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Module
          Value: UserManagement

  UserSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-UserSessions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  NotificationLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-NotificationLogs-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: notificationId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: notificationId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PasswordResetSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-PasswordResetSessions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Module
          Value: PasswordReset

  SecureAnswerAccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-SecureAnswerAccess-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accessId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: accessId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Module
          Value: SecureAnswerAccess

  # NEW TABLE FOR SECURITY QUESTION OTP MANAGEMENT
  SecurityQuestionOtpTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-SecurityQuestionOtp-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Module
          Value: SecurityQuestionOtp

  UserNotificationTopicsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-UserNotificationTopics-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # SNS Topics
  RegistrationNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-Registration-Notifications-${Environment}'
      DisplayName: 'DALScooter Registration Notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  LoginNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-Login-Notifications-${Environment}'
      DisplayName: 'DALScooter Login Notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PasswordResetNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-PasswordReset-Notifications-${Environment}'
      DisplayName: 'DALScooter Password Reset Notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  SecurityQuestionOtpTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-SecurityQuestionOtp-${Environment}'
      DisplayName: 'DALScooter Security Question OTP'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-UserPool-${Environment}'
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AutoVerifiedAttributes:
        - email
      EmailVerificationMessage: |
        Welcome to DALScooter!
        
        Thank you for registering with DALScooter, your scooter rental service.
        
        Please verify your email address by entering this verification code in the application:
        
        Verification Code: {####}
        
        This code will expire in 24 hours.
        
        If you didn't create this account, please ignore this email.
        
        Best regards,
        DALScooter Team
      EmailVerificationSubject: 'Verify your DALScooter account'
      VerificationMessageTemplate:
        EmailMessage: |
          Welcome to DALScooter!
          
          Thank you for registering with DALScooter, your scooter rental service.
          
          Please verify your email address by entering this verification code in the application:
          
          Verification Code: {####}
          
          This code will expire in 24 hours.
          
          If you didn't create this account, please ignore this email.
          
          Best regards,
          DALScooter Team
        EmailSubject: 'Verify your DALScooter account'
        DefaultEmailOption: CONFIRM_WITH_CODE
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: user_type
          AttributeDataType: String
          Required: false
          Mutable: true
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Module: Authentication

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-UserPoolClient-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      ReadAttributes:
        - email
      PreventUserExistenceErrors: ENABLED

  # ============= EXISTING LAMBDA FUNCTIONS (UNCHANGED) =============

  UserRegistrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-UserRegistration-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SECURITY_QUESTIONS_TABLE: !Ref SecurityQuestionsTable
          USER_NOTIFICATION_TOPICS_TABLE: !Ref UserNotificationTopicsTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
          REGISTRATION_TOPIC_ARN: !Ref RegistrationNotificationTopic
          PROJECT_NAME: !Ref ProjectName
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import json
          import boto3
          import hashlib
          import random
          import uuid
          import os
          import base64
          from datetime import datetime
          
          dynamodb = boto3.resource('dynamodb')
          cognito = boto3.client('cognito-idp')
          sns = boto3.client('sns')
          
          def lambda_handler(event, context):
              print(f"Registration event: {json.dumps(event)}")
              
              try:
                  if 'body' in event:
                      body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
                  else:
                      body = event
                  
                  email = body.get('email', '').strip().lower()
                  password = body.get('password', '')
                  user_type = body.get('userType', 'customer').lower()
                  security_question = body.get('securityQuestion', '').strip()
                  security_answer = body.get('securityAnswer', '').strip()
                  
                  if not all([email, password, security_question, security_answer]):
                      return response_with_cors(400, {'error': 'Missing required fields: email, password, securityQuestion, securityAnswer'})
                  
                  if user_type not in ['customer', 'franchise']:
                      return response_with_cors(400, {'error': 'userType must be either "customer" or "franchise"'})
                  
                  if len(password) < 8:
                      return response_with_cors(400, {'error': 'Password must be at least 8 characters long'})
                  
                  users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                  existing_user = users_table.scan(
                      FilterExpression='email = :email',
                      ExpressionAttributeValues={':email': email}
                  )
                  
                  if existing_user['Items']:
                      return response_with_cors(400, {'error': 'User with this email already exists'})
                  
                  user_id = str(uuid.uuid4())
                  
                  try:
                      cognito_response = cognito.sign_up(
                          ClientId=os.environ['COGNITO_CLIENT_ID'],
                          Username=email,
                          Password=password,
                          UserAttributes=[
                              {'Name': 'email', 'Value': email},
                              {'Name': 'custom:user_type', 'Value': user_type}
                          ]
                      )
                      print(f"Cognito user created: {email}")
                  except cognito.exceptions.UsernameExistsException:
                      return response_with_cors(400, {'error': 'User already exists in the system'})
                  except Exception as e:
                      print(f"Cognito error: {str(e)}")
                      return response_with_cors(400, {'error': f'User creation failed: {str(e)}'})
                  
                  # Create user-specific SNS topic for email notifications
                  user_topic_arn = create_user_notification_topic(user_id, email, user_type)
                  
                  users_table.put_item(
                      Item={
                          'userId': user_id,
                          'email': email,
                          'userType': user_type,
                          'registrationDate': datetime.now().isoformat(),
                          'isActive': True,
                          'verificationStatus': 'pending',
                          'cognitoUsername': email,
                          'notificationTopicArn': user_topic_arn
                      }
                  )
                  
                  security_table = dynamodb.Table(os.environ['SECURITY_QUESTIONS_TABLE'])
                  caesar_challenge = generate_caesar_challenge()
                  
                  cleaned_answer = security_answer.lower().strip()
                  hashed_answer = hashlib.sha256(cleaned_answer.encode()).hexdigest()
                  encrypted_answer = encrypt_security_answer(cleaned_answer, user_id)
                  
                  security_table.put_item(
                      Item={
                          'userId': user_id,
                          'securityQuestion': security_question,
                          'securityAnswer': hashed_answer, 
                          'encryptedAnswer': encrypted_answer, 
                          'caesarChallenge': caesar_challenge,
                          'createdAt': datetime.now().isoformat()
                      }
                  )
                  
                  # Store user topic information
                  topics_table = dynamodb.Table(os.environ['USER_NOTIFICATION_TOPICS_TABLE'])
                  topics_table.put_item(
                      Item={
                          'userId': user_id,
                          'email': email,
                          'userType': user_type,
                          'notificationTopicArn': user_topic_arn,
                          'subscriptionStatus': 'pending',
                          'createdAt': datetime.now().isoformat()
                      }
                  )
                  
                  send_registration_notification(email, user_id, user_type, user_topic_arn)
                  
                  print(f"User registered successfully: {user_id}")
                  return response_with_cors(200, {
                      'message': 'User registered successfully! Please check your email for verification code.',
                      'userId': user_id,
                      'email': email,
                      'userType': user_type,
                      'verificationRequired': True,
                      'nextStep': 'Please verify your email address using the code sent to your email.'
                  })
                  
              except Exception as e:
                  print(f"Registration error: {str(e)}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
          def encrypt_security_answer(answer, user_id):
              """Simple encryption using base64 and user_id as key for obfuscation"""
              try:
                  key = hashlib.md5(user_id.encode()).hexdigest()
                                    
                  encrypted = ""
                  for i, char in enumerate(answer):
                      key_char = key[i % len(key)]
                      encrypted += chr(ord(char) ^ ord(key_char))
                  
                  return base64.b64encode(encrypted.encode('latin-1')).decode('utf-8')
              except Exception as e:
                  print(f"Encryption error: {str(e)}")
                  return base64.b64encode(answer.encode('utf-8')).decode('utf-8') # Fallback to simple base64
          
          def create_user_notification_topic(user_id, email, user_type):
              try:
                  project_name = os.environ.get('PROJECT_NAME', 'DALScooter')
                  environment = os.environ.get('ENVIRONMENT', 'dev')
                  topic_name = f"{project_name}-User-{user_id}-Notifications-{environment}"
                  
                  response = sns.create_topic(
                      Name=topic_name,
                      Tags=[
                          {'Key': 'Project', 'Value': project_name},
                          {'Key': 'Environment', 'Value': environment},
                          {'Key': 'UserId', 'Value': user_id},
                          {'Key': 'UserType', 'Value': user_type},
                          {'Key': 'Email', 'Value': email}
                      ]
                  )
                  
                  topic_arn = response['TopicArn']
                  
                  # Subscribe user's email to their personal topic
                  sns.subscribe(
                      TopicArn=topic_arn,
                      Protocol='email',
                      Endpoint=email
                  )
                  
                  print(f"Created personal notification topic for user {user_id}: {topic_arn}")
                  return topic_arn
                  
              except Exception as e:
                  print(f"Error creating user notification topic: {str(e)}")
                  return None
          
          def send_registration_notification(email, user_id, user_type, user_topic_arn):
              try:
                  topic_arn = os.environ.get('REGISTRATION_TOPIC_ARN', '')
                  if not topic_arn:
                      print("No registration topic ARN configured, skipping notification")
                      return
                  
                  message = {
                      'email': email,
                      'userId': user_id,
                      'userType': user_type,
                      'userTopicArn': user_topic_arn,
                      'timestamp': datetime.now().isoformat(),
                      'event': 'user_registered'
                  }
                  
                  sns.publish(
                      TopicArn=topic_arn,
                      Message=json.dumps(message),
                      Subject=f'DALScooter Registration - {email}'
                  )
                  
                  print(f"Registration notification sent for user: {user_id}")
              except Exception as e:
                  print(f"Error sending registration notification: {str(e)}")
          
          def generate_caesar_challenge():
              words = ['CLOUD', 'SERVERLESS', 'LAMBDA', 'DYNAMO', 'COGNITO', 'GATEWAY', 'SECURE', 'CRYPTO']
              word = random.choice(words)
              shift = random.randint(1, 25)

              encoded = ""
              for char in word:
                  if char.isalpha():
                      encoded += chr((ord(char) - ord('A') + shift) % 26 + ord('A'))
                  else:
                      encoded += char
              
              return {
                  'originalWord': word,
                  'encodedWord': encoded,
                  'shift': shift,
                  'hint': f"Decode this word using Caesar cipher (shift by {shift}): {encoded}",
                  'instructions': f"Each letter is shifted {shift} positions forward in the alphabet"
              }
          
          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'POST,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body)
              }

  EmailVerificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-EmailVerification-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          USER_NOTIFICATION_TOPICS_TABLE: !Ref UserNotificationTopicsTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          
          dynamodb = boto3.resource('dynamodb')
          cognito = boto3.client('cognito-idp')
          
          def lambda_handler(event, context):
              print(f"Email verification event: {json.dumps(event)}")
              
              try:
                  if 'body' in event:
                      body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
                  else:
                      body = event
                  
                  email = body.get('email', '').strip().lower()
                  verification_code = body.get('verificationCode', '').strip()
                  
                  if not email or not verification_code:
                      return response_with_cors(400, {'error': 'Email and verification code are required'})
                  
                  try:
                      cognito.confirm_sign_up(
                          ClientId=os.environ['COGNITO_CLIENT_ID'],
                          Username=email,
                          ConfirmationCode=verification_code
                      )
                      
                      user_id = get_user_id_by_email(email)
                      if user_id:
                          users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                          users_table.update_item(
                              Key={'userId': user_id},
                              UpdateExpression='SET verificationStatus = :status, verifiedAt = :verified_at',
                              ExpressionAttributeValues={
                                  ':status': 'verified',
                                  ':verified_at': datetime.now().isoformat()
                              }
                          )
                          
                          # Update subscription status in topics table
                          topics_table = dynamodb.Table(os.environ['USER_NOTIFICATION_TOPICS_TABLE'])
                          topics_table.update_item(
                              Key={'userId': user_id},
                              UpdateExpression='SET subscriptionStatus = :status, verifiedAt = :verified_at',
                              ExpressionAttributeValues={
                                  ':status': 'confirmed',
                                  ':verified_at': datetime.now().isoformat()
                              }
                          )
                      
                      print(f"Email verified successfully for: {email}")
                      return response_with_cors(200, {
                          'message': 'Email verified successfully! You can now login.',
                          'verified': True
                      })
                      
                  except cognito.exceptions.CodeMismatchException:
                      return response_with_cors(400, {'error': 'Invalid verification code'})
                  except cognito.exceptions.ExpiredCodeException:
                      return response_with_cors(400, {'error': 'Verification code has expired'})
                  except cognito.exceptions.NotAuthorizedException:
                      return response_with_cors(400, {'error': 'User is already verified'})
                  except Exception as e:
                      print(f"Verification error: {str(e)}")
                      return response_with_cors(400, {'error': 'Verification failed'})
                      
              except Exception as e:
                  print(f"Email verification error: {str(e)}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
          def get_user_id_by_email(email):
              try:
                  users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                  response = users_table.scan(
                      FilterExpression='email = :email',
                      ExpressionAttributeValues={':email': email}
                  )
                  
                  if response['Items']:
                      return response['Items'][0]['userId']
                  return None
              except Exception as e:
                  print(f"Error getting user ID: {str(e)}")
                  return None
          
          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'POST,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body)
              }

  ResendVerificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-ResendVerification-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          cognito = boto3.client('cognito-idp')
          
          def lambda_handler(event, context):
              print(f"Resend verification event: {json.dumps(event)}")
              
              try:
                  if 'body' in event:
                      body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
                  else:
                      body = event
                  
                  email = body.get('email', '').strip().lower()
                  
                  if not email:
                      return response_with_cors(400, {'error': 'Email is required'})
                  
                  try:
                      cognito.resend_confirmation_code(
                          ClientId=os.environ['COGNITO_CLIENT_ID'],
                          Username=email
                      )
                      
                      print(f"Verification code resent for: {email}")
                      return response_with_cors(200, {
                          'message': 'Verification code sent to your email address.'
                      })
                      
                  except cognito.exceptions.InvalidParameterException:
                      return response_with_cors(400, {'error': 'User not found or already verified'})
                  except Exception as e:
                      print(f"Resend error: {str(e)}")
                      return response_with_cors(400, {'error': 'Failed to resend verification code'})
                      
              except Exception as e:
                  print(f"Resend verification error: {str(e)}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
