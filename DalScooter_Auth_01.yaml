              try:
                  if 'body' in event:
                      body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
                  else:
                      body = event
                  
                  email = body.get('email', '').strip().lower()
                  verification_code = body.get('verificationCode', '').strip()
                  new_password = body.get('newPassword', '')
                  session_id = body.get('sessionId', '')
                  
                  if not all([email, verification_code, new_password, session_id]):
                      return response_with_cors(400, {
                          'error': 'Email, verification code, new password, and session ID are required'
                      })
                  
                  # Validate password strength
                  if len(new_password) < 8:
                      return response_with_cors(400, {'error': 'Password must be at least 8 characters long'})
                  
                  # Verify session exists and is valid
                  reset_sessions_table = dynamodb.Table(os.environ['PASSWORD_RESET_SESSIONS_TABLE'])
                  session_response = reset_sessions_table.get_item(Key={'sessionId': session_id})
                  
