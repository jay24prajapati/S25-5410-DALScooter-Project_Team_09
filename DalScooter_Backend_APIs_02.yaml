                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  
                  if 'Item' not in booking_response:
                      return response_with_cors(404, {'error': 'Booking not found'})
                  
                  booking = booking_response['Item']
                  if booking['customer_id'] != customer_id:
                      return response_with_cors(403, {'error': 'Cannot view messages for booking not owned by you'})
                  
                  messages_table = dynamodb.Table(os.environ['MESSAGES_TABLE'])
                  messages_response = messages_table.query(
                      IndexName='BookingMessages',
                      KeyConditionExpression=Key('booking_id').eq(booking_id),
                      ScanIndexForward=True
                  )
                  
                  messages = []
                  for item in messages_response['Items']:
                      messages.append({
                          'message_id': item['message_id'],
                          'content': item['content'],
                          'sender': item['sender'],
                          'createdAt': item['createdAt']
                      })
                  
                  return response_with_cors(200, {
                      'booking_id': booking_id,
                      'messages': messages,
                      'totalMessages': len(messages)
                  })
              except Exception as e:
                  print(f"Error getting booking messages: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})
          
          def get_conversation_history(booking_id, user_id, user_type):
              try:
                  if not booking_id:
                      return response_with_cors(400, {'error': 'booking_id is required'})
                  
                  # Verify booking access
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  
                  if 'Item' not in booking_response:
                      return response_with_cors(404, {'error': 'Booking not found'})
                  
                  booking = booking_response['Item']
                  
                  if user_type == 'customer' and booking['customer_id'] != user_id:
                      return response_with_cors(403, {'error': 'Access denied'})
                  elif user_type == 'franchise' and booking.get('franchise_id') != user_id:
                      return response_with_cors(403, {'error': 'Access denied'})
                  
                  messages_table = dynamodb.Table(os.environ['MESSAGES_TABLE'])
                  messages_response = messages_table.query(
                      IndexName='BookingMessages',
                      KeyConditionExpression=Key('booking_id').eq(booking_id),
                      ScanIndexForward=True
                  )
                  
                  messages = []
                  for item in messages_response['Items']:
                      messages.append({
                          'message_id': item['message_id'],
                          'content': item['content'],
                          'sender': item['sender'],
                          'createdAt': item['createdAt']
                      })
                  
                  # Get customer and bike info 
                  users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                  customer_response = users_table.get_item(Key={'userId': booking['customer_id']})
                  customer_info = customer_response.get('Item', {})
                  
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  bike_response = bikes_table.get_item(Key={'bike_id': booking['bike_id']})
                  bike_info = bike_response.get('Item', {})
                  
                  return response_with_cors(200, {
                      'booking_id': booking_id,
                      'booking_info': {
                          'date': booking['date'],
                          'status': booking['status'],
                          'bike_type': bike_info.get('type', 'Unknown'),
                          'customer_email': customer_info.get('email', 'N/A')
                      },
                      'messages': messages,
                      'totalMessages': len(messages)
                  })
              except Exception as e:
                  print(f"Error getting conversation history: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})
          
          def get_franchise_messages(franchise_id):
              try:
                  messages_table = dynamodb.Table(os.environ['MESSAGES_TABLE'])
                  
                  # Get all messages for franchise user
                  messages_response = messages_table.query(
                      IndexName='FranchiseMessages',
                      KeyConditionExpression=Key('franchise_id').eq(franchise_id),
                      ScanIndexForward=False
                  )
                  
                  messages = []
                  for item in messages_response['Items']:
                      messages.append({
                          'message_id': item['message_id'],
                          'booking_id': item['booking_id'],
                          'customer_id': item['customer_id'],
                          'content': item['content'][:100] + '...' if len(item['content']) > 100 else item['content'],
                          'sender': item['sender'],
                          'createdAt': item['createdAt']
                      })
                  
                  return response_with_cors(200, {
                      'messages': messages,
                      'total': len(messages)
                  })
              except Exception as e:
                  print(f"Error getting franchise messages: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})
          
          def analyze_sentiment(comment, rating):
              try:
                  if comment and len(comment.strip()) > 0:
                      # Use AWS Comprehend for sentiment analysis
                      result = comprehend.detect_sentiment(Text=comment, LanguageCode='en')
                      sentiment = result['Sentiment'].lower()
                  else:
                      # Fallback to rating-based sentiment
                      if rating >= 4:
                          sentiment = 'positive'
                      elif rating == 3:
                          sentiment = 'neutral'
                      else:
                          sentiment = 'negative'
                  
                  return sentiment
              except Exception as e:
                  print(f"Error analyzing sentiment: {str(e)}")
                  # Fallback to rating-based sentiment
                  if rating >= 4:
                      return 'positive'
                  elif rating == 3:
                      return 'neutral'
                  else:
                      return 'negative'
          
          def generate_access_code():
              return ''.join(random.choices(string.ascii_uppercase + string.digits, k=8))
          
          def send_notification(topic_arn, message, subject):
              try:
                  sns.publish(
                      TopicArn=topic_arn,
                      Message=message,
                      Subject=subject
                  )
              except Exception as e:
                  print(f"Error sending notification: {str(e)}")
          
          def extract_user_info_from_context(event):
              try:
                  request_context = event.get('requestContext', {})
                  authorizer = request_context.get('authorizer', {})
                  claims = authorizer.get('claims', {})
                  
                  email = claims.get('email')
                  
                  if email:
                      users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                      response = users_table.scan(
                          FilterExpression='email = :email',
                          ExpressionAttributeValues={':email': email}
                      )
                      
                      if response['Items']:
                          user_data = response['Items'][0]
                          if user_data.get('isActive', False):
                              return user_data['userId'], user_data['userType']
                  
                  return None, None
              except Exception as e:
                  print(f"Error extracting user info: {str(e)}")
                  return None, None
          
          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'GET,POST,PUT,DELETE,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body, default=str)
              }

  # BOOKING PROCESSOR using SQS Trigger
  BookingProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-BookingProcessor-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          BOOKINGS_TABLE: !Ref BookingsTable
          BIKES_TABLE: !Ref BikesTable
          CUSTOMER_NOTIFICATIONS_TOPIC: !Ref CustomerNotificationsTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          from boto3.dynamodb.conditions import Key
          
          dynamodb = boto3.resource('dynamodb')
          sns = boto3.client('sns')
          
          def lambda_handler(event, context):
              print(f"Booking processor event: {json.dumps(event)}")
              
              for record in event['Records']:
                  try:
                      message_body = json.loads(record['body'])
                      
                      if message_body.get('action') == 'approve_booking':
                          process_booking_approval(message_body)
                      
                  except Exception as e:
                      print(f"Error processing booking: {str(e)}")
                      continue
              
              return {'statusCode': 200, 'body': 'Bookings processed'}
          
          def process_booking_approval(message):
              try:
                  booking_id = message['booking_id']
                  customer_id = message['customer_id']
                  bike_id = message['bike_id']
                  franchise_id = message['franchise_id']
                  date = message['date']
                  
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  
                  # Get current booking
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  if 'Item' not in booking_response:
                      print(f"Booking not found: {booking_id}")
                      return
                  
                  booking = booking_response['Item']
                  if booking['status'] != 'PENDING':
                      print(f"Booking not pending: {booking_id}")
                      return
                  
                  # Check bike availability
                  bike_response = bikes_table.get_item(Key={'bike_id': bike_id})
                  if 'Item' not in bike_response:
                      # Cancel booking - bike not found
                      cancel_booking_with_reason(booking_id, "Bike no longer available")
                      return
                  
                  bike = bike_response['Item']
                  if bike.get('status') != 'ACTIVE':
                      # Cancel booking - bike inactive
                      cancel_booking_with_reason(booking_id, "Bike no longer available")
                      return
                  
                  # Check availability for the date
                  existing_bookings = bookings_table.query(
                      IndexName='BikeBookings',
                      KeyConditionExpression=Key('bike_id').eq(bike_id) & Key('date').eq(date),
                      FilterExpression='#status IN (:confirmed, :pending)',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':confirmed': 'CONFIRMED',
                          ':pending': 'PENDING'
                      }
                  )
                  
                  booked_count = len(existing_bookings['Items'])
                  if booked_count > int(bike['count']):
                      # Cancel booking - no availability
                      cancel_booking_with_reason(booking_id, "No availability for this date")
                      return
                  
                  # Auto-approve booking
                  access_code = booking.get('accessCode', 'AUTO' + booking_id[:6])
                  
                  bookings_table.update_item(
                      Key={'booking_id': booking_id},
                      UpdateExpression='SET #status = :status, accessCode = :code, approvedAt = :approved',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'CONFIRMED',
                          ':code': access_code,
                          ':approved': datetime.now().isoformat()
                      }
                  )
                  
                  # Send approval notification
                  send_notification(
                      f"Your booking {booking_id} has been automatically approved! Access code: {access_code}",
                      "Booking Approved"
                  )
                  
                  print(f"Booking approved: {booking_id}")
                  
              except Exception as e:
                  print(f"Error processing booking approval: {str(e)}")
          
          def cancel_booking_with_reason(booking_id, reason):
              try:
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  
                  bookings_table.update_item(
                      Key={'booking_id': booking_id},
                      UpdateExpression='SET #status = :status, cancellationReason = :reason, cancelledAt = :cancelled',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'CANCELLED',
                          ':reason': reason,
                          ':cancelled': datetime.now().isoformat()
                      }
                  )
                  
                  # Send cancellation notification
                  send_notification(
                      f"Your booking {booking_id} was cancelled: {reason}",
                      "Booking Cancelled"
                  )
                  
                  print(f"Booking cancelled: {booking_id} - {reason}")
                  
              except Exception as e:
                  print(f"Error cancelling booking: {str(e)}")
          
          def send_notification(message, subject):
              try:
                  sns.publish(
                      TopicArn=os.environ['CUSTOMER_NOTIFICATIONS_TOPIC'],
                      Message=message,
                      Subject=subject
                  )
              except Exception as e:
                  print(f"Error sending notification: {str(e)}")

