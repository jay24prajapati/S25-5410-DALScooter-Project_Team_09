          def create_bike(event, franchise_id):
              try:
                  body = json.loads(event['body']) if event.get('body') else {}
                  
                  bike_type = body.get('type', '').strip()
                  daily_rate = body.get('dailyRate')
                  features = body.get('features', {})
                  count = body.get('count')
                  
                  if not bike_type or daily_rate is None or count is None:
                      return response_with_cors(400, {'error': 'type, dailyRate, and count are required'})
                  
                  if bike_type not in ['Gyroscooter', 'eBike', 'Segway']:
                      return response_with_cors(400, {'error': 'Invalid bike type. Must be Gyroscooter, eBike, or Segway'})
                  
                  if daily_rate <= 0 or count <= 0:
                      return response_with_cors(400, {'error': 'dailyRate and count must be positive numbers'})
                  
                  bike_id = str(uuid.uuid4())
                  access_code = generate_access_code()
                  
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  bike_data = {
                      'bike_id': bike_id,
                      'type': bike_type,
                      'dailyRate': str(daily_rate),
                      'features': features,
                      'count': int(count),
                      'accessCode': access_code,
                      'status': 'ACTIVE',
                      'franchise_id': franchise_id,
                      'createdAt': datetime.now().isoformat()
                  }
                  
                  bikes_table.put_item(Item=bike_data)
                  
                  return response_with_cors(201, {
                      'bike_id': bike_id,
                      'accessCode': access_code,
                      'message': 'Bike created successfully'
                  })
              except Exception as e:
                  print(f"Error creating bike: {str(e)}")
                  return response_with_cors(500, {'error': 'Bike creation failed'})
          
          def update_bike(event, bike_id, franchise_id):
              try:
                  if not bike_id:
                      return response_with_cors(400, {'error': 'bike_id is required'})
                  
                  body = json.loads(event['body']) if event.get('body') else {}
                  
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  
                  # Verify bike exists and belongs to franchise
                  bike_response = bikes_table.get_item(Key={'bike_id': bike_id})
                  if 'Item' not in bike_response:
                      return response_with_cors(404, {'error': 'Bike not found'})
                  
                  bike = bike_response['Item']
                  if bike.get('franchise_id') != franchise_id:
                      return response_with_cors(403, {'error': 'Access denied'})
                  
                  # Prepare update expression
                  update_expressions = []
                  expression_values = {
                      ':updated': datetime.now().isoformat()
                  }
                  
                  if 'dailyRate' in body and body['dailyRate'] > 0:
                      update_expressions.append('dailyRate = :rate')
                      expression_values[':rate'] = str(body['dailyRate'])
                  
                  if 'features' in body:
                      update_expressions.append('features = :features')
                      expression_values[':features'] = body['features']
                  
                  if 'count' in body:
                      new_count = int(body['count'])
                      if new_count <= 0:
                          return response_with_cors(400, {'error': 'count must be positive'})
                      
                      # Check if reducing count below active bookings
                      bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                      active_bookings = bookings_table.scan(
                          FilterExpression='bike_id = :bike_id AND #status IN (:confirmed, :pending)',
                          ExpressionAttributeNames={'#status': 'status'},
                          ExpressionAttributeValues={
                              ':bike_id': bike_id,
                              ':confirmed': 'CONFIRMED',
                              ':pending': 'PENDING'
                          }
                      )
                      
                      # Group by date to check max bookings per day
                      bookings_by_date = {}
                      for booking in active_bookings['Items']:
                          date = booking['date']
                          bookings_by_date[date] = bookings_by_date.get(date, 0) + 1
                      
                      max_bookings = max(bookings_by_date.values()) if bookings_by_date else 0
                      if new_count < max_bookings:
                          return response_with_cors(400, {'error': f'Cannot reduce count below {max_bookings} (active bookings)'})
                      
                      update_expressions.append('#count = :count')
                      expression_values[':count'] = new_count
                  
                  if not update_expressions:
                      return response_with_cors(400, {'error': 'No valid fields to update'})
                  
                  update_expressions.append('updatedAt = :updated')
                  
                  expression_names = {}
                  if '#count' in ' '.join(update_expressions):
                      expression_names['#count'] = 'count'
                  
                  update_expression = 'SET ' + ', '.join(update_expressions)
                  
                  update_kwargs = {
                      'Key': {'bike_id': bike_id},
                      'UpdateExpression': update_expression,
                      'ExpressionAttributeValues': expression_values
                  }
                  
                  if expression_names:
                      update_kwargs['ExpressionAttributeNames'] = expression_names
                  
                  bikes_table.update_item(**update_kwargs)
                  
                  return response_with_cors(200, {'message': 'Bike updated successfully'})
              except Exception as e:
                  print(f"Error updating bike: {str(e)}")
                  return response_with_cors(500, {'error': 'Bike update failed'})
          
