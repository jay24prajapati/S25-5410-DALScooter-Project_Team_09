          def send_message(event, user_id, user_type):
              try:
                  body = json.loads(event['body']) if event.get('body') else {}
                  booking_id = body.get('booking_id', '').strip()
                  content = body.get('content', '').strip()
                  
                  if not booking_id or not content:
                      return response_with_cors(400, {'error': 'booking_id and content are required'})
                  
                  # Verify booking exists
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  
                  if 'Item' not in booking_response:
                      return response_with_cors(400, {'error': 'Booking not found'})
                  
                  booking = booking_response['Item']
                  
                  # Verify access based on user type
                  if user_type == 'customer':
                      if booking['customer_id'] != user_id:
                          return response_with_cors(403, {'error': 'Cannot send message for booking not owned by you'})
                      sender = 'CUSTOMER'
                  elif user_type == 'franchise':
                      if booking.get('franchise_id') != user_id:
                          return response_with_cors(403, {'error': 'Access denied'})
                      sender = 'FRANCHISE'
                  else:
                      return response_with_cors(403, {'error': 'Invalid user type'})
                  
                  message_id = str(uuid.uuid4())
                  messages_table = dynamodb.Table(os.environ['MESSAGES_TABLE'])
                  
                  message_data = {
                      'message_id': message_id,
                      'booking_id': booking_id,
                      'customer_id': booking['customer_id'],
                      'franchise_id': booking['franchise_id'],
                      'content': content,
                      'sender': sender,
                      'createdAt': datetime.now().isoformat(),
                      'ttl': int((datetime.now() + timedelta(days=90)).timestamp())
                  }
                  
                  messages_table.put_item(Item=message_data)
                  
                  return response_with_cors(201, {
                      'message_id': message_id,
                      'message': 'Message sent successfully'
                  })
                  
              except Exception as e:
                  print(f"Error sending message: {str(e)}")
                  return response_with_cors(500, {'error': 'Message sending failed'})
          
          def get_booking_messages(booking_id, user_id, user_type):
              try:
                  if not booking_id:
                      return response_with_cors(400, {'error': 'booking_id is required'})
                  
                  # Verify booking exists and user has access
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  
                  if 'Item' not in booking_response:
                      return response_with_cors(404, {'error': 'Booking not found'})
                  
                  booking = booking_response['Item']
                  
                  # Verify access based on user type
                  if user_type == 'customer':
                      if booking['customer_id'] != user_id:
                          return response_with_cors(403, {'error': 'Cannot view messages for booking not owned by you'})
                  elif user_type == 'franchise':
                      if booking.get('franchise_id') != user_id:
                          return response_with_cors(403, {'error': 'Access denied'})
                  else:
                      return response_with_cors(403, {'error': 'Invalid user type'})
                  
                  # Get messages for this booking
                  messages_table = dynamodb.Table(os.environ['MESSAGES_TABLE'])
                  messages_response = messages_table.query(
                      IndexName='BookingMessages',
                      KeyConditionExpression=Key('booking_id').eq(booking_id),
