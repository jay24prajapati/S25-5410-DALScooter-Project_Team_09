AWSTemplateFormatVersion: '2010-09-09'
Description: 'DALScooter Backend APIs Implementation - Franchise Side (Bike, Send Message) and Customer Side (Bike Booking Management, Feedback, Send Message)'

Parameters:
  ProjectName:
    Type: String
    Default: 'DALScooter'
    Description: 'Project name for resource naming'
  
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: 
      - dev
      - prod
    Description: 'Environment name'

  # Import from Module 1 (Auth Module)
  UsersTableName:
    Type: String
    Description: 'Users table name from Module 1'
    
  UserSessionsTableName:
    Type: String
    Description: 'User Sessions table name from Module 1'
    
  APIGatewayId:
    Type: String
    Description: 'API Gateway ID from Module 1'
    
  APIGatewayRootResourceId:
    Type: String
    Description: 'API Gateway Root Resource ID from Module 1'

  CognitoUserPoolId:
    Type: String
    Description: 'Cognito User Pool ID from Module 1'

  CognitoUserPoolClientId:
    Type: String
    Description: 'Cognito User Pool Client ID from Module 1'

Resources:
  # COGNITO AUTHORIZER
  
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-CognitoAuthorizer-${Environment}'
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      RestApiId: !Ref APIGatewayId
      ProviderARNs: 
        - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # DYNAMODB TABLES 
  
  BikesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Bikes-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bike_id
          AttributeType: S
        - AttributeName: type
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
      KeySchema:
        - AttributeName: bike_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BikeTypeIndex
          KeySchema:
            - AttributeName: type
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: BikeStatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseBikesIndex
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Bookings-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: booking_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: bike_id
          AttributeType: S
        - AttributeName: date
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
      KeySchema:
        - AttributeName: booking_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CustomerBookings
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: BikeBookings
          KeySchema:
            - AttributeName: bike_id
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: BookingStatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseBookings
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Feedback-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: feedback_id
          AttributeType: S
        - AttributeName: bike_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
      KeySchema:
        - AttributeName: feedback_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BikeFeedback
          KeySchema:
            - AttributeName: bike_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CustomerFeedback
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseFeedback
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Messages-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: message_id
          AttributeType: S
        - AttributeName: booking_id
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
        - AttributeName: conversation_id
          AttributeType: S
      KeySchema:
        - AttributeName: message_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BookingMessages
          KeySchema:
            - AttributeName: booking_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CustomerMessages
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseMessages
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ConversationMessages
          KeySchema:
            - AttributeName: conversation_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Table for Cancellation Requests
  CancellationRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-CancellationRequests-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cancellation_id
          AttributeType: S
        - AttributeName: booking_id
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: cancellation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BookingCancellations
          KeySchema:
            - AttributeName: booking_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseCancellations
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CancellationStatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # SQS QUEUES 
  
  BookingRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-BookingRequest-Queue-${Environment}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BookingRequestDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  BookingRequestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-BookingRequest-DLQ-${Environment}'
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # SNS TOPICS
  
  CustomerNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-CustomerNotifications-${Environment}'
      DisplayName: 'DALScooter Customer Notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  FranchiseNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-FranchiseNotifications-${Environment}'
      DisplayName: 'DALScooter Franchise Notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # CLOUDWATCH LOG GROUPS 
  
  PublicBikesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-PublicBikes-${Environment}'
      RetentionInDays: 14

  UnifiedAPILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-UnifiedAPI-${Environment}'
      RetentionInDays: 14

  BookingProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-BookingProcessor-${Environment}'
      RetentionInDays: 14

  #  LAMBDA FUNCTIONS 

  # Public APIs for Guest Users
  PublicBikesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-PublicBikes-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BIKES_TABLE: !Ref BikesTable
          BOOKINGS_TABLE: !Ref BookingsTable
          FEEDBACK_TABLE: !Ref FeedbackTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          from boto3.dynamodb.conditions import Key
          
          dynamodb = boto3.resource('dynamodb')
          
          def lambda_handler(event, context):
              print(f"Public bikes event: {json.dumps(event)}")
              
              try:
                  http_method = event.get('httpMethod', 'GET')
                  path = event.get('path', '')
                  path_params = event.get('pathParameters') or {}
                  query_params = event.get('queryStringParameters') or {}
                  
                  if path == '/bikes' and http_method == 'GET':
                      return get_bikes(query_params)
                  elif '/bikes/' in path and path.endswith('/feedback') and http_method == 'GET':
                      bike_id = path_params.get('bike_id')
                      return get_bike_feedback(bike_id)
                  else:
                      return response_with_cors(404, {'error': 'Endpoint not found'})
                      
              except Exception as e:
                  print(f"Public bikes error: {str(e)}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
          def get_bikes(query_params):
              try:
                  date = query_params.get('date')
                  bike_type = query_params.get('type')
                  
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  
                  # Query bikes
                  if bike_type:
                      bikes_response = bikes_table.query(
                          IndexName='BikeTypeIndex',
                          KeyConditionExpression=Key('type').eq(bike_type),
                          FilterExpression='#status = :status',
                          ExpressionAttributeNames={'#status': 'status'},
                          ExpressionAttributeValues={':status': 'ACTIVE'}
                      )
                  else:
                      bikes_response = bikes_table.query(
                          IndexName='BikeStatusIndex',
                          KeyConditionExpression=Key('status').eq('ACTIVE')
                      )
                  
                  result = []
                  for bike in bikes_response['Items']:
                      bike_data = {
                          'bike_id': bike['bike_id'],
                          'type': bike['type'],
                          'dailyRate': float(bike['dailyRate']),
                          'features': bike.get('features', {}),
                          'count': int(bike['count']),
                          'available': True
                      }
                      
                      # Check availability for specific date
                      if date:
                          try:
                              datetime.strptime(date, '%Y-%m-%d')
                              bookings_response = bookings_table.query(
                                  IndexName='BikeBookings',
                                  KeyConditionExpression=Key('bike_id').eq(bike['bike_id']) & Key('date').eq(date),
                                  FilterExpression='#status IN (:confirmed, :pending)',
                                  ExpressionAttributeNames={'#status': 'status'},
                                  ExpressionAttributeValues={
                                      ':confirmed': 'CONFIRMED',
                                      ':pending': 'PENDING'
                                  }
                              )
                              
                              booked_count = len(bookings_response['Items'])
                              available_count = int(bike['count']) - booked_count
                              bike_data['available'] = available_count > 0
                              bike_data['availableCount'] = available_count
                          except ValueError:
                              return response_with_cors(400, {'error': 'Invalid date format. Use YYYY-MM-DD'})
                      
                      result.append(bike_data)
                  
                  return response_with_cors(200, result)
              except Exception as e:
                  print(f"Error getting bikes: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})
          
          def get_bike_feedback(bike_id):
              try:
                  if not bike_id:
                      return response_with_cors(400, {'error': 'bike_id is required'})
                  
                  # Check if bike available
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  bike_response = bikes_table.get_item(Key={'bike_id': bike_id})
                  
                  if 'Item' not in bike_response:
                      return response_with_cors(404, {'error': 'Bike not found'})
                  
                  feedback_table = dynamodb.Table(os.environ['FEEDBACK_TABLE'])
                  feedback_response = feedback_table.query(
                      IndexName='BikeFeedback',
                      KeyConditionExpression=Key('bike_id').eq(bike_id),
                      ScanIndexForward=False,
                      Limit=50
                  )
                  
                  feedback_list = []
                  total_rating = 0
                  sentiment_counts = {'positive': 0, 'neutral': 0, 'negative': 0}
                  
                  for item in feedback_response['Items']:
                      feedback_item = {
                          'feedback_id': item['feedback_id'],
                          'rating': int(item['rating']),
                          'comment': item.get('comment', ''),
                          'sentiment': item.get('sentiment', 'neutral'),
                          'createdAt': item['createdAt']
                      }
                      feedback_list.append(feedback_item)
                      total_rating += int(item['rating'])
                      sentiment = item.get('sentiment', 'neutral')
                      if sentiment in sentiment_counts:
                          sentiment_counts[sentiment] += 1
                  
                  # Calculate overall statistics
                  average_rating = round(total_rating / len(feedback_list), 1) if feedback_list else 0
                  total_feedback = len(feedback_list)
                  
                  return response_with_cors(200, {
                      'bike_id': bike_id,
                      'feedback': feedback_list,
                      'statistics': {
                          'totalFeedback': total_feedback,
                          'averageRating': average_rating,
                          'sentimentBreakdown': sentiment_counts
                      }
                  })
              except Exception as e:
                  print(f"Error getting bike feedback: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})
          
          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'GET,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body, default=str)
              }

  # API function for Authenticated Operations
  UnifiedAPIFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-UnifiedAPI-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          BIKES_TABLE: !Ref BikesTable
          BOOKINGS_TABLE: !Ref BookingsTable
          FEEDBACK_TABLE: !Ref FeedbackTable
          MESSAGES_TABLE: !Ref MessagesTable
          CANCELLATION_REQUESTS_TABLE: !Ref CancellationRequestsTable
          USERS_TABLE: !Ref UsersTableName
          BOOKING_QUEUE_URL: !Ref BookingRequestQueue
          CUSTOMER_NOTIFICATIONS_TOPIC: !Ref CustomerNotificationsTopic
          FRANCHISE_NOTIFICATIONS_TOPIC: !Ref FranchiseNotificationsTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import uuid
          import os
          from datetime import datetime, timedelta
          from boto3.dynamodb.conditions import Key, Attr
          import random
          import string
          
          dynamodb = boto3.resource('dynamodb')
          sqs = boto3.client('sqs')
          sns = boto3.client('sns')
          comprehend = boto3.client('comprehend')
          
          def lambda_handler(event, context):
              print(f"Unified API event: {json.dumps(event)}")
              
              try:
                  http_method = event.get('httpMethod', 'GET')
                  path = event.get('path', '')
                  path_params = event.get('pathParameters') or {}
                  
                  # Extract user ID and type from Cognito authorizer context
                  user_id, user_type = extract_user_info_from_context(event)
                  if not user_id:
                      return response_with_cors(401, {'error': 'Authentication required'})
                  
                  print(f"User: {user_id}, Type: {user_type}, Path: {path}, Method: {http_method}")
                  
                  # CUSTOMER ENDPOINTS 
                  if user_type == 'customer':
                      # Booking operations
                      if path == '/bookings' and http_method == 'POST':
                          return create_booking(event, user_id)
                      elif path == '/bookings' and http_method == 'GET':
                          return get_customer_bookings(user_id)
                      elif '/bookings/' in path and not path.endswith('/messages') and http_method == 'DELETE':
                          booking_id = path_params.get('booking_id')
                          return request_booking_cancellation(booking_id, user_id)
                      
                      # Customer profile operations
                      elif path == '/customers/profile' and http_method == 'GET':
                          return get_customer_profile(user_id)
                      
                      # Feedback operations
                      elif '/bikes/' in path and path.endswith('/feedback') and http_method == 'POST':
                          bike_id = path_params.get('bike_id')
                          return submit_feedback(event, bike_id, user_id)
                      
                      # Message operations
                      elif path == '/messages' and http_method == 'POST':
                          return send_message(event, user_id, user_type)
                      elif '/bookings/' in path and path.endswith('/messages') and http_method == 'GET':
                          booking_id = path_params.get('booking_id')
                          return get_booking_messages(booking_id, user_id)
                      elif '/messages/conversations' in path and http_method == 'GET':
                          return get_customer_conversations(user_id)
                      elif '/messages/conversation/' in path and http_method == 'GET':
                          booking_id = path_params.get('booking_id')
                          return get_conversation_history(booking_id, user_id, user_type)
                  
                  # FRANCHISE ENDPOINTS 
                  elif user_type == 'franchise':
                      # Bike management
                      if path == '/bikes' and http_method == 'POST':
                          return create_bike(event, user_id)
                      elif '/bikes/' in path and http_method == 'PUT':
                          bike_id = path_params.get('bike_id')
                          return update_bike(event, bike_id, user_id)
                      elif '/bikes/' in path and http_method == 'DELETE':
                          bike_id = path_params.get('bike_id')
                          return delete_bike(bike_id, user_id)
                      
                      # Booking management
                      elif path == '/franchise/bookings' and http_method == 'GET':
                          return get_franchise_bookings(user_id, event.get('queryStringParameters', {}))
                      elif '/bookings/' in path and not path.endswith('/messages') and not path.endswith('/approve') and http_method == 'GET':
                          booking_id = path_params.get('booking_id')
                          return get_booking_details(booking_id, user_id)
                      elif '/bookings/' in path and path.endswith('/approve') and http_method == 'PUT':
                          booking_id = path_params.get('booking_id')
                          return approve_booking(booking_id, user_id)
                      
                      # Cancellation management
                      elif path == '/franchise/cancellations' and http_method == 'GET':
                          return get_franchise_cancellation_requests(user_id)
                      elif '/bookings/' in path and path.endswith('/cancel-approve') and http_method == 'PUT':
                          booking_id = path_params.get('booking_id')
                          return approve_cancellation(booking_id, user_id)
                      elif '/bookings/' in path and path.endswith('/cancel-reject') and http_method == 'PUT':
                          booking_id = path_params.get('booking_id')
                          return reject_cancellation(booking_id, user_id)
                      
                      # Customer management
                      elif path == '/franchise/customers' and http_method == 'GET':
                          return get_franchise_customers(user_id, event.get('queryStringParameters', {}))
                      elif '/franchise/customers/' in path and not path.endswith('/bookings') and not path.endswith('/messages') and http_method == 'GET':
                          customer_id = path_params.get('customer_id')
                          return get_customer_details(customer_id, user_id)
                      elif '/franchise/customers/' in path and path.endswith('/bookings') and http_method == 'GET':
                          customer_id = path_params.get('customer_id')
                          return get_customer_bookings_for_franchise(customer_id, user_id)
                      elif '/franchise/customers/' in path and path.endswith('/messages') and http_method == 'GET':
                          customer_id = path_params.get('customer_id')
                          return get_customer_messages_for_franchise(customer_id, user_id)
                      
                      # Message operations
                      elif path == '/messages' and http_method == 'POST':
                          return send_message(event, user_id, user_type)
                      elif path == '/messages' and http_method == 'GET':
                          return get_franchise_messages(user_id)
                      elif path == '/franchise/conversations' and http_method == 'GET':
                          return get_franchise_conversations(user_id)
                      elif '/franchise/conversations/' in path and http_method == 'GET':
                          customer_id = path_params.get('customer_id')
                          return get_franchise_customer_conversation(customer_id, user_id)
                      elif '/messages/conversation/' in path and http_method == 'GET':
                          booking_id = path_params.get('booking_id')
                          return get_conversation_history(booking_id, user_id, user_type)
                      
                      # Dashboard
                      elif path == '/franchise/dashboard' and http_method == 'GET':
                          return get_franchise_dashboard(user_id)
                  
                  return response_with_cors(404, {'error': 'Endpoint not found or access denied'})
                      
              except Exception as e:
                  print(f"Unified API error: {str(e)}")
                  import traceback
                  print(f"Traceback: {traceback.format_exc()}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
          # CUSTOMER FUNCTIONS
          
          def create_booking(event, customer_id):
              try:
                  body = json.loads(event['body']) if event.get('body') else {}
                  
                  bike_id = body.get('bike_id', '').strip()
                  date = body.get('date', '').strip()
                  
                  if not bike_id or not date:
                      return response_with_cors(400, {'error': 'bike_id and date are required'})
                  
                  # Validate date format and future date
                  try:
                      booking_date = datetime.strptime(date, '%Y-%m-%d')
                      if booking_date.date() < datetime.now().date():
                          return response_with_cors(400, {'error': 'Cannot book for past dates'})
                  except ValueError:
                      return response_with_cors(400, {'error': 'Invalid date format. Use YYYY-MM-DD'})
                  
                  # Check if bike exists and is available
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  bike_response = bikes_table.get_item(Key={'bike_id': bike_id})
                  
                  if 'Item' not in bike_response:
                      return response_with_cors(400, {'error': 'Bike not found'})
                  
                  bike = bike_response['Item']
                  if bike.get('status') != 'ACTIVE':
                      return response_with_cors(400, {'error': 'Bike not available'})
                  
                  franchise_id = bike.get('franchise_id')
                  if not franchise_id:
                      return response_with_cors(400, {'error': 'Bike has no assigned franchise'})
                  
                  # Check availability for the date
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  existing_bookings = bookings_table.query(
                      IndexName='BikeBookings',
                      KeyConditionExpression=Key('bike_id').eq(bike_id) & Key('date').eq(date),
                      FilterExpression='#status IN (:confirmed, :pending)',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':confirmed': 'CONFIRMED',
                          ':pending': 'PENDING'
                      }
                  )
                  
                  booked_count = len(existing_bookings['Items'])
                  if booked_count >= int(bike['count']):
                      return response_with_cors(400, {'error': 'Bike unavailable for this date'})
                  
                  # Check for duplicate booking
                  customer_bookings = bookings_table.query(
                      IndexName='CustomerBookings',
                      KeyConditionExpression=Key('customer_id').eq(customer_id) & Key('date').eq(date),
                      FilterExpression='bike_id = :bike_id AND #status IN (:confirmed, :pending)',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':bike_id': bike_id,
                          ':confirmed': 'CONFIRMED',
                          ':pending': 'PENDING'
                      }
                  )
                  
                  if customer_bookings['Items']:
                      return response_with_cors(400, {'error': 'Duplicate booking for same bike and date'})
                  
                  booking_id = str(uuid.uuid4())
                  access_code = generate_access_code()
                  
                  # Create booking with PENDING status
                  booking_data = {
                      'booking_id': booking_id,
                      'customer_id': customer_id,
                      'bike_id': bike_id,
                      'franchise_id': franchise_id,
                      'date': date,
                      'status': 'PENDING',
                      'accessCode': access_code,
                      'dailyRate': bike['dailyRate'],
                      'createdAt': datetime.now().isoformat()
                  }
                  
                  bookings_table.put_item(Item=booking_data)
                  
                  # Send to SQS for approval processing
                  message_body = {
                      'booking_id': booking_id,
                      'customer_id': customer_id,
                      'bike_id': bike_id,
                      'franchise_id': franchise_id,
                      'date': date,
                      'action': 'approve_booking'
                  }
                  
                  sqs.send_message(
                      QueueUrl=os.environ['BOOKING_QUEUE_URL'],
                      MessageBody=json.dumps(message_body)
                  )
                  
                  return response_with_cors(201, {
                      'booking_id': booking_id,
                      'bike_id': bike_id,
                      'date': date,
                      'status': 'PENDING',
                      'message': 'Booking created successfully. Awaiting approval.'
                  })
              except Exception as e:
                  print(f"Error creating booking: {str(e)}")
                  return response_with_cors(500, {'error': 'Booking creation failed'})
          
