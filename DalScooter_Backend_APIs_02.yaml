          def request_booking_cancellation(booking_id, customer_id):
              try:
                  if not booking_id:
                      return response_with_cors(400, {'error': 'booking_id is required'})
                  
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  
                  if 'Item' not in booking_response:
                      return response_with_cors(404, {'error': 'Booking not found'})
                  
                  booking = booking_response['Item']
                  
                  # Verify booking belongs to customer
                  if booking['customer_id'] != customer_id:
                      return response_with_cors(403, {'error': 'Cannot cancel booking not owned by you'})
                  
                  # Check if booking can be cancelled
                  if booking['status'] in ['CANCELLED', 'CANCELLATION_PENDING']:
                      return response_with_cors(400, {'error': f'Booking already in {booking["status"]} status'})
                  
                  # Check if booking date has passed
                  booking_date = datetime.strptime(booking['date'], '%Y-%m-%d').date()
                  if booking_date < datetime.now().date():
                      return response_with_cors(403, {'error': 'Cannot cancel past bookings'})
                  
                  # Create cancellation request
                  cancellation_id = str(uuid.uuid4())
                  cancellation_table = dynamodb.Table(os.environ['CANCELLATION_REQUESTS_TABLE'])
                  
                  cancellation_data = {
                      'cancellation_id': cancellation_id,
                      'booking_id': booking_id,
                      'customer_id': customer_id,
                      'franchise_id': booking['franchise_id'],
                      'status': 'PENDING',
                      'reason': 'Customer requested cancellation',
                      'createdAt': datetime.now().isoformat(),
                      'ttl': int((datetime.now() + timedelta(days=30)).timestamp())
                  }
                  
                  cancellation_table.put_item(Item=cancellation_data)
                  
                  # Update booking status
                  bookings_table.update_item(
                      Key={'booking_id': booking_id},
                      UpdateExpression='SET #status = :status, cancellationRequestedAt = :requested',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'CANCELLATION_PENDING',
                          ':requested': datetime.now().isoformat()
                      }
                  )
                  
                  # Send notification to franchise
                  send_notification(
                      topic_arn=os.environ['FRANCHISE_NOTIFICATIONS_TOPIC'],
                      message=f"Cancellation request for booking {booking_id} from customer {customer_id}",
                      subject="Booking Cancellation Request"
                  )
                  
                  return response_with_cors(200, {
                      'message': 'Cancellation request submitted successfully. Awaiting franchise approval.',
                      'cancellation_id': cancellation_id
                  })
              except Exception as e:
                  print(f"Error requesting cancellation: {str(e)}")
                  return response_with_cors(500, {'error': 'Cancellation request failed'})
          
