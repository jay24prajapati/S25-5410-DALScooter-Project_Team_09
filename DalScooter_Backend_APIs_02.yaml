              except Exception as e:
                  print(f"Error sending inventory update: {str(e)}")
          
          def update_future_inventory(bike_id, new_count):
              try:
                  inventory_table = dynamodb.Table(os.environ['BIKE_INVENTORY_TABLE'])
                  today_str = date.today().isoformat()
                  
                  # Update all future inventory records
                  inventory_response = inventory_table.scan(
                      FilterExpression='bike_id = :bike_id AND #date >= :today',
                      ExpressionAttributeNames={'#date': 'date'},
                      ExpressionAttributeValues={
                          ':bike_id': bike_id,
                          ':today': today_str
                      }
                  )
                  
                  for item in inventory_response['Items']:
                      inventory_table.update_item(
                          Key={'bike_id': bike_id, 'date': item['date']},
                          UpdateExpression='SET total_count = :total, last_updated = :now',
                          ExpressionAttributeValues={
                              ':total': new_count,
                              ':now': datetime.now().isoformat()
                          }
                      )
                  
              except Exception as e:
                  print(f"Error updating future inventory: {str(e)}")
          
          def extract_user_info_from_context(event):
              try:
                  request_context = event.get('requestContext', {})
                  authorizer = request_context.get('authorizer', {})
                  claims = authorizer.get('claims', {})
                  
                  email = claims.get('email')
                  if email:
                      users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                      response = users_table.scan(
                          FilterExpression='email = :email',
                          ExpressionAttributeValues={':email': email}
                      )
                      
                      if response['Items']:
                          user_data = response['Items'][0]
                          if user_data.get('isActive', False):
                              return user_data['userId'], user_data['userType']
                  
                  return None, None
                  
              except Exception as e:
                  print(f"Error extracting user info: {str(e)}")
                  return None, None
          
          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'GET,POST,PUT,DELETE,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body, default=str)
              }

  # REAL-TIME INVENTORY SYNC FUNCTION
  InventorySyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-InventorySync-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          BIKE_INVENTORY_TABLE: !Ref BikeInventoryTable
          INVENTORY_UPDATES_TOPIC: !Ref InventoryUpdatesTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime, date
          
          dynamodb = boto3.resource('dynamodb')
          sns = boto3.client('sns')
          
          def lambda_handler(event, context):
              print(f"Inventory sync event: {json.dumps(event)}")
              
              try:
                  # Process DynamoDB stream records from Bikes table
                  for record in event['Records']:
                      if record['eventName'] in ['INSERT', 'MODIFY', 'REMOVE']:
                          process_bike_change(record)
                  
                  return {'statusCode': 200, 'body': 'Inventory sync completed'}
                  
              except Exception as e:
                  print(f"Error in inventory sync: {str(e)}")
                  return {'statusCode': 500, 'body': 'Inventory sync failed'}
          
          def process_bike_change(record):
              try:
                  event_name = record['eventName']
                  
                  if event_name == 'INSERT':
                      # New bike added - no inventory update needed as there are no bookings yet
                      bike_data = record['dynamodb']['NewImage']
                      print(f"New bike added: {bike_data}")
                      
                  elif event_name == 'MODIFY':
                      # Bike modified - check if count changed
                      old_data = record['dynamodb'].get('OldImage', {})
                      new_data = record['dynamodb']['NewImage']
                      
                      old_count = int(old_data.get('count', {}).get('N', 0))
                      new_count = int(new_data.get('count', {}).get('N', 0))
                      
                      if old_count != new_count:
                          bike_id = new_data['bike_id']['S']
                          franchise_id = new_data['franchise_id']['S']
                          
                          print(f"Bike count changed: {bike_id}, {old_count} -> {new_count}")
                          
                          # Send real-time update notification
                          send_real_time_update({
                              'type': 'bike_count_updated',
                              'bike_id': bike_id,
                              'franchise_id': franchise_id,
                              'old_count': old_count,
                              'new_count': new_count,
                              'timestamp': datetime.now().isoformat()
                          })
                      
                  elif event_name == 'REMOVE':
                      # Bike removed/deactivated
                      bike_data = record['dynamodb']['OldImage']
                      bike_id = bike_data['bike_id']['S']
                      franchise_id = bike_data['franchise_id']['S']
                      
                      print(f"Bike removed: {bike_id}")
                      
                      send_real_time_update({
                          'type': 'bike_removed',
                          'bike_id': bike_id,
                          'franchise_id': franchise_id,
                          'timestamp': datetime.now().isoformat()
                      })
                      
              except Exception as e:
                  print(f"Error processing bike change: {str(e)}")
          
          def send_real_time_update(update_data):
              try:
                  sns.publish(
                      TopicArn=os.environ['INVENTORY_UPDATES_TOPIC'],
                      Message=json.dumps(update_data),
                      Subject=f"Real-time Inventory Update - {update_data.get('type', 'update')}"
                  )
                  print(f"Real-time update sent: {update_data}")
              except Exception as e:
                  print(f"Error sending real-time update: {str(e)}")

