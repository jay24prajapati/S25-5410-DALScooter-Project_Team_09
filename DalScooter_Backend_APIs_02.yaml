                  )
                  
                  return response_with_cors(200, {
                      'franchise_id': franchise_id,
                      'bookingStatistics': {
                          'totalBookings': total_bookings,
                          'totalRevenue': total_revenue,
                          'uniqueCustomers': unique_customers,
                          'statusBreakdown': status_counts,
                          'monthlyRevenue': monthly_revenue
                      },
                      'bikeStatistics': {
                          'activeBikes': active_bikes,
                          'totalBikeCount': total_bike_count,
                          'bikeTypeBreakdown': bike_types
                      },
                      'pendingActions': {
                          'pendingBookings': status_counts.get('PENDING', 0),
                          'pendingCancellations': len(pending_cancellations.get('Items', []))
                      }
                  })
