          def edit_customer_feedback(event, feedback_id, customer_id):
              try:
                  if not feedback_id:
                      return response_with_cors(400, {'error': 'feedback_id is required'})

                  body = json.loads(event['body']) if event.get('body') else {}
                  rating = body.get('rating')
                  comment = body.get('comment')
                  
                  if comment is not None:
                      comment = comment.strip() if isinstance(comment, str) else str(comment).strip()

                  if rating is None and comment is None:
                      return response_with_cors(400, {'error': 'At least rating or comment must be provided'})

                  if rating is not None and (not isinstance(rating, int) or rating < 1 or rating > 5):
                      return response_with_cors(400, {'error': 'Rating must be an integer between 1 and 5'})

                  feedback_table = dynamodb.Table(os.environ['FEEDBACK_TABLE'])
                  
                  # Get existing feedback
                  feedback_response = feedback_table.get_item(Key={'feedback_id': feedback_id})

                  if 'Item' not in feedback_response:
                      return response_with_cors(404, {'error': 'Feedback not found'})

                  feedback = feedback_response['Item']

                  if feedback['customer_id'] != customer_id:
                      return response_with_cors(403, {'error': 'Cannot edit feedback not owned by you'})

                  if feedback.get('type') != 'CUSTOMER_FEEDBACK':
                      return response_with_cors(400, {'error': 'Can only edit customer feedback'})

                  update_expressions = []
                  expression_values = {':updated': datetime.now().isoformat()}

                  # rating update
                  if rating is not None:
                      update_expressions.append('rating = :rating')
                      expression_values[':rating'] = rating

                  # comment update
                  if comment is not None:
                      update_expressions.append('comment = :comment')
                      expression_values[':comment'] = comment

                  current_rating = rating if rating is not None else feedback.get('rating', 3)
                  current_comment = comment if comment is not None else feedback.get('comment', '')
                  
                  sentiment = analyze_sentiment(current_comment, current_rating)
                  update_expressions.append('sentiment = :sentiment')
                  expression_values[':sentiment'] = sentiment

                  update_expressions.append('updatedAt = :updated')

                  expression_names = {}
                  if comment is not None:
                      expression_names['#comment'] = 'comment'
                  if rating is not None:
                      expression_names['#rating'] = 'rating'
                  expression_names['#sentiment'] = 'sentiment'
                  expression_names['#updatedAt'] = 'updatedAt'

                  final_expressions = []
                  for exp in update_expressions:
                      if 'comment = :comment' in exp:
                          final_expressions.append('#comment = :comment')
                      elif 'rating = :rating' in exp:
                          final_expressions.append('#rating = :rating')
                      elif 'sentiment = :sentiment' in exp:
                          final_expressions.append('#sentiment = :sentiment')
                      elif 'updatedAt = :updated' in exp:
                          final_expressions.append('#updatedAt = :updated')
                      else:
                          final_expressions.append(exp)

                  feedback_table.update_item(
                      Key={'feedback_id': feedback_id},
                      UpdateExpression='SET ' + ', '.join(final_expressions),
                      ExpressionAttributeNames=expression_names,
                      ExpressionAttributeValues=expression_values
                  )

                  return response_with_cors(200, {
                      'message': 'Feedback updated successfully',
                      'feedback_id': feedback_id,
                      'sentiment': sentiment
                  })

              except Exception as e:
                  print(f"Error editing feedback: {str(e)}")
                  print(f"Traceback: {traceback.format_exc()}")
                  return response_with_cors(500, {'error': 'Feedback update failed'})



