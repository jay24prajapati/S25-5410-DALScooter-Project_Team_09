          def cancel_booking(booking_id, customer_id):
              try:
                  if not booking_id:
                      return response_with_cors(400, {'error': 'booking_id is required'})
                  
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  
                  if 'Item' not in booking_response:
                      return response_with_cors(404, {'error': 'Booking not found'})
                  
                  booking = booking_response['Item']
                  
                  # Verify booking belongs to customer
                  if booking['customer_id'] != customer_id:
                      return response_with_cors(403, {'error': 'Cannot cancel booking not owned by you'})
                  
                  # Check if booking can be cancelled
                  if booking['status'] in ['CANCELLED']:
                      return response_with_cors(400, {'error': 'Booking is already cancelled'})
                  
                  booking_date = datetime.strptime(booking['date'], '%Y-%m-%d').date()
                  today = date.today()
                  days_until_booking = (booking_date - today).days
                  
                  # Automatic cancellation if more than 24 hours (1 day) before
                  if days_until_booking >= 1:
                      # Automatically cancel
                      bookings_table.update_item(
                          Key={'booking_id': booking_id},
                          UpdateExpression='SET #status = :status, cancelledAt = :cancelled, cancellationReason = :reason',
                          ExpressionAttributeNames={'#status': 'status'},
                          ExpressionAttributeValues={
                              ':status': 'CANCELLED',
                              ':cancelled': datetime.now().isoformat(),
                              ':reason': 'Automatic cancellation - Customer request'
                          }
                      )
                      
                      # Update inventory - free up the slot
                      inventory_table = dynamodb.Table(os.environ['BIKE_INVENTORY_TABLE'])
                      inventory_table.update_item(
                          Key={'bike_id': booking['bike_id'], 'date': booking['date']},
                          UpdateExpression='ADD booked_count :dec SET last_updated = :now',
                          ExpressionAttributeValues={
                              ':dec': -1,
                              ':now': datetime.now().isoformat()
                          }
                      )
                      
                      # Send cancellation notification
                      send_notification({
                          'type': 'booking_cancelled',
                          'booking_id': booking_id,
                          'customer_id': customer_id,
                          'reason': 'automatic',
                          'refund_eligible': True
                      })
                      
                      return response_with_cors(200, {
                          'message': 'Booking cancelled successfully. You are eligible for a full refund.',
                          'cancelled': True,
                          'refund_eligible': True
                      })
                  else:
                      # Cannot cancel automatically - too close to booking date
                      return response_with_cors(400, {
                          'error': 'Cannot cancel booking less than 24 hours before the booking date',
                          'cancelled': False,
                          'contact_support': True,
                          'message': 'Please contact customer support for assistance with this cancellation.'
                      })
                      
              except Exception as e:
                  print(f"Error cancelling booking: {str(e)}")
                  return response_with_cors(500, {'error': 'Cancellation failed'})
          
