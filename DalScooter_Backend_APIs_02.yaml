          def submit_feedback(event, bike_id, customer_id):
              try:
                  body = json.loads(event['body']) if event.get('body') else {}
                  booking_id = body.get('booking_id', '').strip()
                  rating = body.get('rating')
                  comment = body.get('comment', '').strip()

                  if not booking_id or rating is None:
                      return response_with_cors(400, {'error': 'booking_id and rating are required'})

                  if not isinstance(rating, int) or rating < 1 or rating > 5:
                      return response_with_cors(400, {'error': 'Rating must be an integer between 1 and 5'})

                  # Verify booking exists and belongs to customer
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})

                  if 'Item' not in booking_response:
                      return response_with_cors(400, {'error': 'Booking not found'})

                  booking = booking_response['Item']

                  if booking['customer_id'] != customer_id:
                      return response_with_cors(403, {'error': 'Cannot provide feedback for booking not owned by you'})

                  if booking['bike_id'] != bike_id:
                      return response_with_cors(400, {'error': 'Booking is not for this bike'})

                  if booking['status'] != 'CONFIRMED':
                      return response_with_cors(400, {'error': 'Can only provide feedback for confirmed bookings'})

                  # Check if feedback already exists
                  feedback_table = dynamodb.Table(os.environ['FEEDBACK_TABLE'])
                  existing_feedback = feedback_table.query(
                      IndexName='CustomerFeedback',
                      KeyConditionExpression=Key('customer_id').eq(customer_id),
                      FilterExpression='booking_id = :booking_id',
                      ExpressionAttributeValues={':booking_id': booking_id}
                  )

                  if existing_feedback['Items']:
                      return response_with_cors(400, {'error': 'Feedback already submitted for this booking'})

                  # Analyze sentiment
                  sentiment = analyze_sentiment(comment, rating)

                  feedback_id = str(uuid.uuid4())
                  feedback_data = {
                      'feedback_id': feedback_id,
                      'bike_id': bike_id,
                      'customer_id': customer_id,
                      'booking_id': booking_id,
                      'franchise_id': booking['franchise_id'],
                      'rating': rating,
                      'comment': comment,
                      'sentiment': sentiment,
                      'type': 'CUSTOMER_FEEDBACK', 
                      'createdAt': datetime.now().isoformat(),
                      'updatedAt': datetime.now().isoformat()
                  }

                  feedback_table.put_item(Item=feedback_data)

                  return response_with_cors(201, {
                      'feedback_id': feedback_id,
                      'sentiment': sentiment,
                      'message': 'Feedback submitted successfully'
                  })

              except Exception as e:
                  print(f"Error submitting feedback: {str(e)}")
                  return response_with_cors(500, {'error': 'Feedback submission failed'})
          

