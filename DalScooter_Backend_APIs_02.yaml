Outputs:
  # API Endpoints - Public (No Auth Required)
  PublicBikesEndpoint:
    Description: 'Public Bikes API Endpoint (No Auth)'
    Value: !Sub 'https://${APIGatewayId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/bikes'

  PublicFeedbackEndpoint:
    Description: 'Public Bike Feedback API Endpoint (No Auth)'
    Value: !Sub 'https://${APIGatewayId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/bikes/{bike_id}/feedback'

  # API Endpoints - Customer (Auth Required)
  CustomerBookingsEndpoint:
    Description: 'Customer Bookings API Endpoint (Auth Required)'
    Value: !Sub 'https://${APIGatewayId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/bookings'

  CustomerProfileEndpoint:
