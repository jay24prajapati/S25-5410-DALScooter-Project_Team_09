                  if 'Item' not in feedback_response:
                      return response_with_cors(404, {'error': 'Feedback not found'})

                  feedback = feedback_response['Item']

                  if feedback.get('franchise_id') != franchise_id:
                      return response_with_cors(403, {'error': 'Cannot reply to feedback not for your bikes'})

                  if feedback.get('type') != 'CUSTOMER_FEEDBACK':
                      return response_with_cors(400, {'error': 'Can only reply to customer feedback'})

                  # Check if franchise already replied
                  existing_reply = feedback_table.query(
                      IndexName='FeedbackReplies',
                      KeyConditionExpression=Key('parent_feedback_id').eq(feedback_id),
                      FilterExpression='franchise_id = :franchise_id AND #type = :type',
