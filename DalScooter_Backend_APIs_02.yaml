          def get_customer_conversations(customer_id):
              try:
                  messages_table = dynamodb.Table(os.environ['MESSAGES_TABLE'])
                  
                  # Get all bookings for customer that have messages
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  customer_bookings = bookings_table.query(
                      IndexName='CustomerBookings',
                      KeyConditionExpression=Key('customer_id').eq(customer_id)
                  )
                  
                  conversations = []
                  for booking in customer_bookings['Items']:
                      booking_id = booking['booking_id']
                      
                      # Get latest message for this booking
                      messages_response = messages_table.query(
                          IndexName='BookingMessages',
                          KeyConditionExpression=Key('booking_id').eq(booking_id),
                          ScanIndexForward=False,
                          Limit=1
                      )
                      
                      if messages_response['Items']:
                          latest_message = messages_response['Items'][0]
                          conversations.append({
                              'booking_id': booking_id,
                              'bike_id': booking['bike_id'],
                              'date': booking['date'],
                              'status': booking['status'],
                              'lastMessage': {
                                  'content': latest_message['content'][:100] + '...' if len(latest_message['content']) > 100 else latest_message['content'],
                                  'sender': latest_message['sender'],
                                  'createdAt': latest_message['createdAt']
                              }
                          })
                  
                  # Sort by latest message time
                  conversations.sort(key=lambda x: x['lastMessage']['createdAt'], reverse=True)
                  
                  return response_with_cors(200, conversations)
                  
              except Exception as e:
                  print(f"Error getting customer conversations: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})
          
          def get_franchise_conversations(franchise_id):
              try:
                  # Get all unique customers who have messaged this franchise
                  messages_table = dynamodb.Table(os.environ['MESSAGES_TABLE'])
                  messages_response = messages_table.query(
                      IndexName='FranchiseMessages',
                      KeyConditionExpression=Key('franchise_id').eq(franchise_id)
                  )
                  
                  conversations = {}
                  for message in messages_response['Items']:
                      customer_id = message['customer_id']
                      if customer_id not in conversations:
                          conversations[customer_id] = {
                              'customer_id': customer_id,
                              'messageCount': 0,
                              'lastMessage': None,
                              'bookings': set()
                          }
                      
                      conv = conversations[customer_id]
                      conv['messageCount'] += 1
                      conv['bookings'].add(message['booking_id'])
                      
                      # Track latest message
                      if not conv['lastMessage'] or message['createdAt'] > conv['lastMessage']['createdAt']:
                          conv['lastMessage'] = {
                              'content': message['content'][:100] + '...' if len(message['content']) > 100 else message['content'],
                              'sender': message['sender'],
                              'createdAt': message['createdAt'],
                              'booking_id': message['booking_id']
                          }
                  
                  # Convert to list and get customer details
                  users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                  result = []
                  
                  for customer_id, conv_data in conversations.items():
                      user_response = users_table.get_item(Key={'userId': customer_id})
                      user_info = user_response.get('Item', {})
                      
                      result.append({
                          'customer_id': customer_id,
                          'customer_email': user_info.get('email', 'N/A'),
                          'messageCount': conv_data['messageCount'],
                          'totalBookings': len(conv_data['bookings']),
                          'lastMessage': conv_data['lastMessage']
                      })
                  
                  # Sort by last message time
                  result.sort(key=lambda x: x['lastMessage']['createdAt'] if x['lastMessage'] else '', reverse=True)
                  
                  return response_with_cors(200, result)
                  
              except Exception as e:
                  print(f"Error getting franchise conversations: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})
          
          # UTILITY FUNCTIONS
          def analyze_sentiment(comment, rating):
              try:
                  if not isinstance(rating, (int, float)) or rating < 1 or rating > 5:
                      rating = 3  
                  
                  rating = int(rating)
                  
                  if comment and isinstance(comment, str) and len(comment.strip()) > 0:
                      try:
                          result = comprehend.detect_sentiment(Text=comment.strip(), LanguageCode='en')
                          sentiment = result['Sentiment'].lower()
                          return sentiment
                      except Exception as comprehend_error:
                          print(f"Comprehend error: {str(comprehend_error)}")
                          pass
                  
                  # Fallback to rating-based sentiment
                  if rating >= 4:
                      return 'positive'
                  elif rating == 3:
                      return 'neutral'
                  else:
                      return 'negative'
                      
              except Exception as e:
                  print(f"Error analyzing sentiment: {str(e)}")
                  return 'neutral'


          
