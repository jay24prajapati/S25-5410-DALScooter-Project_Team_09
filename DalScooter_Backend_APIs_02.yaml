AWSTemplateFormatVersion: '2010-09-09'

Description: 'DALScooter Backend APIs - Simplified with Real-time Inventory & Automatic Booking'

Parameters:
  ProjectName:
    Type: String
    Default: 'DALScooter'
    Description: 'Project name for resource naming'
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: [dev, prod]
    Description: 'Environment name'
  
  # Import from Module 1 (Auth Module)
  UsersTableName:
    Type: String
    Description: 'Users table name from Module 1'
  UserSessionsTableName:
    Type: String
    Description: 'User Sessions table name from Module 1'
  APIGatewayId:
    Type: String
    Description: 'API Gateway ID from Module 1'
  APIGatewayRootResourceId:
    Type: String
    Description: 'API Gateway Root Resource ID from Module 1'
  CognitoUserPoolId:
    Type: String
    Description: 'Cognito User Pool ID from Module 1'

Resources:
  # COGNITO AUTHORIZER
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-CognitoAuthorizer-${Environment}'
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      RestApiId: !Ref APIGatewayId
      ProviderARNs:
        - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # DYNAMODB TABLES
  BikesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Bikes-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bike_id
          AttributeType: S
        - AttributeName: type
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
      KeySchema:
        - AttributeName: bike_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BikeTypeIndex
          KeySchema:
            - AttributeName: type
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: BikeStatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseBikesIndex
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Bookings-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: booking_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: bike_id
          AttributeType: S
        - AttributeName: date
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
      KeySchema:
        - AttributeName: booking_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CustomerBookings
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: BikeBookings
          KeySchema:
            - AttributeName: bike_id
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: BookingStatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseBookings
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Feedback-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: feedback_id
          AttributeType: S
        - AttributeName: bike_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
        - AttributeName: parent_feedback_id
          AttributeType: S
      KeySchema:
        - AttributeName: feedback_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BikeFeedback
          KeySchema:
            - AttributeName: bike_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CustomerFeedback
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseFeedback
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: FeedbackReplies
          KeySchema:
            - AttributeName: parent_feedback_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-Messages-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: message_id
          AttributeType: S
        - AttributeName: booking_id
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: franchise_id
          AttributeType: S
      KeySchema:
        - AttributeName: message_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BookingMessages
          KeySchema:
            - AttributeName: booking_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CustomerMessages
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: FranchiseMessages
          KeySchema:
            - AttributeName: franchise_id
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # REAL-TIME INVENTORY TABLE
  BikeInventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-BikeInventory-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bike_id
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: bike_id
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # SNS TOPICS
  BookingNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-BookingNotifications-${Environment}'
      DisplayName: 'DALScooter Booking Notifications'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  InventoryUpdatesTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-InventoryUpdates-${Environment}'
      DisplayName: 'DALScooter Inventory Updates'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # SQS QUEUES
  BookingProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-BookingProcessing-Queue-${Environment}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BookingProcessingDLQ.Arn
        maxReceiveCount: 3

  BookingProcessingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-BookingProcessing-DLQ-${Environment}'
      MessageRetentionPeriod: 1209600

  # LAMBDA FUNCTIONS

  # Public APIs for Guest Users
  PublicBikesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-PublicBikes-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BIKES_TABLE: !Ref BikesTable
          BIKE_INVENTORY_TABLE: !Ref BikeInventoryTable
          BOOKINGS_TABLE: !Ref BookingsTable
          FEEDBACK_TABLE: !Ref FeedbackTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime, date
          from boto3.dynamodb.conditions import Key
          
          dynamodb = boto3.resource('dynamodb')
          
          def lambda_handler(event, context):
              print(f"Public bikes event: {json.dumps(event)}")
              try:
                  http_method = event.get('httpMethod', 'GET')
                  path = event.get('path', '')
                  path_params = event.get('pathParameters') or {}
                  query_params = event.get('queryStringParameters') or {}
                  
                  if path == '/bikes' and http_method == 'GET':
                      return get_bikes(query_params)
                  elif '/bikes/' in path and path.endswith('/feedback') and http_method == 'GET':
                      bike_id = path_params.get('bike_id')
                      return get_bike_feedback(bike_id)
                  else:
                      return response_with_cors(404, {'error': 'Endpoint not found'})
                      
              except Exception as e:
                  print(f"Public bikes error: {str(e)}")
                  return response_with_cors(500, {'error': 'Internal server error'})
          
          def get_bikes(query_params):
              try:
                  booking_date = query_params.get('date', date.today().isoformat())
                  bike_type = query_params.get('type')
                  
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  inventory_table = dynamodb.Table(os.environ['BIKE_INVENTORY_TABLE'])
                  
                  # Query active bikes
                  if bike_type:
                      bikes_response = bikes_table.query(
                          IndexName='BikeTypeIndex',
                          KeyConditionExpression=Key('type').eq(bike_type),
                          FilterExpression='#status = :status',
                          ExpressionAttributeNames={'#status': 'status'},
                          ExpressionAttributeValues={':status': 'ACTIVE'}
                      )
                  else:
                      bikes_response = bikes_table.query(
                          IndexName='BikeStatusIndex',
                          KeyConditionExpression=Key('status').eq('ACTIVE')
                      )
                  
                  result = []
                  for bike in bikes_response['Items']:
                      # Get real-time availability
                      inventory_response = inventory_table.get_item(
                          Key={
                              'bike_id': bike['bike_id'],
                              'date': booking_date
                          }
                      )
                      
                      total_count = int(bike['count'])
                      booked_count = 0
                      
                      if 'Item' in inventory_response:
                          booked_count = int(inventory_response['Item'].get('booked_count', 0))
                      
                      available_count = total_count - booked_count
                      
                      bike_data = {
                          'bike_id': bike['bike_id'],
                          'type': bike['type'],
                          'dailyRate': float(bike['dailyRate']),
                          'features': bike.get('features', {}),
                          'totalCount': total_count,
                          'availableCount': max(0, available_count),
                          'available': available_count > 0
                      }
                      
                      result.append(bike_data)
                  
                  return response_with_cors(200, result)
                  
              except Exception as e:
                  print(f"Error getting bikes: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})
          
          def get_bike_feedback(bike_id):
              try:
                  if not bike_id:
                      return response_with_cors(400, {'error': 'bike_id is required'})

                  # Check if bike exists
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  bike_response = bikes_table.get_item(Key={'bike_id': bike_id})

                  if 'Item' not in bike_response:
                      return response_with_cors(404, {'error': 'Bike not found'})

                  feedback_table = dynamodb.Table(os.environ['FEEDBACK_TABLE'])
                  feedback_response = feedback_table.query(
                      IndexName='BikeFeedback',
                      KeyConditionExpression=Key('bike_id').eq(bike_id),
                      FilterExpression='#type = :type',
                      ExpressionAttributeNames={'#type': 'type'},
                      ExpressionAttributeValues={':type': 'CUSTOMER_FEEDBACK'},
                      ScanIndexForward=False,
                      Limit=50
                  )

                  feedback_list = []
                  total_rating = 0
                  sentiment_counts = {'positive': 0, 'neutral': 0, 'negative': 0}

                  for item in feedback_response['Items']:
                      # Get franchise reply if exists
                      reply_response = feedback_table.query(
                          IndexName='FeedbackReplies',
                          KeyConditionExpression=Key('parent_feedback_id').eq(item['feedback_id']),
                          FilterExpression='#type = :type',
                          ExpressionAttributeNames={'#type': 'type'},
                          ExpressionAttributeValues={':type': 'FRANCHISE_REPLY'}
                      )

                      franchise_reply = None
                      if reply_response['Items']:
                          reply = reply_response['Items'][0]
                          franchise_reply = {
                              'comment': reply['comment'],
                              'createdAt': reply['createdAt'],
                              'updatedAt': reply.get('updatedAt', reply['createdAt'])
                          }

                      feedback_item = {
                          'feedback_id': item['feedback_id'],
                          'user_id': item["customer_id"],  
                          'rating': int(item['rating']),
                          'comment': item.get('comment', ''),
                          'sentiment': item.get('sentiment', 'neutral'),
                          'createdAt': item['createdAt'],
                          'updatedAt': item.get('updatedAt', item['createdAt']),
                          'franchise_reply': franchise_reply
                      }

                      feedback_list.append(feedback_item)
                      total_rating += int(item['rating'])
                      sentiment = item.get('sentiment', 'neutral')
                      if sentiment in sentiment_counts:
                          sentiment_counts[sentiment] += 1

                  average_rating = round(total_rating / len(feedback_list), 1) if feedback_list else 0
                  total_feedback = len(feedback_list)

                  return response_with_cors(200, {
                      'bike_id': bike_id,
                      'feedback': feedback_list,
                      'statistics': {
                          'totalFeedback': total_feedback,
                          'averageRating': average_rating,
                          'sentimentBreakdown': sentiment_counts
                      }
                  })

              except Exception as e:
                  print(f"Error getting bike feedback: {str(e)}")
                  return response_with_cors(500, {'error': 'Database query failed'})

          def response_with_cors(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                      'Access-Control-Allow-Methods': 'GET,OPTIONS',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body, default=str)
              }

  # Main API function for Authenticated Operations
  UnifiedAPIFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-UnifiedAPI-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          BIKES_TABLE: !Ref BikesTable
          BOOKINGS_TABLE: !Ref BookingsTable
          FEEDBACK_TABLE: !Ref FeedbackTable
          MESSAGES_TABLE: !Ref MessagesTable
          BIKE_INVENTORY_TABLE: !Ref BikeInventoryTable
          USERS_TABLE: !Ref UsersTableName
          BOOKING_PROCESSING_QUEUE_URL: !Ref BookingProcessingQueue
          BOOKING_NOTIFICATIONS_TOPIC: !Ref BookingNotificationsTopic
          INVENTORY_UPDATES_TOPIC: !Ref InventoryUpdatesTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import uuid
          import os
          import traceback
          from datetime import datetime, timedelta, date
          from boto3.dynamodb.conditions import Key, Attr
          import random
          import string

          dynamodb = boto3.resource('dynamodb')
          sqs = boto3.client('sqs')
          sns = boto3.client('sns')
          comprehend = boto3.client('comprehend')

          def lambda_handler(event, context):
              print(f"Unified API event: {json.dumps(event)}")
        
              try:
                  http_method = event.get('httpMethod', 'GET')
                  path = event.get('path', '')
                  path_params = event.get('pathParameters') or {}
                  
                  print(f"Method: {http_method}, Path: {path}, Path Params: {path_params}")
                  
                  # Extract user info from Cognito context
                  user_id, user_type = extract_user_info_from_context(event)
                  if not user_id:
                      return response_with_cors(401, {'error': 'Authentication required'})

                  print(f"User: {user_id}, Type: {user_type}, Path: {path}, Method: {http_method}")

                  # CUSTOMER ENDPOINTS
                  if user_type == 'customer':
                      if path == '/bookings' and http_method == 'POST':
                          return create_booking(event, user_id)
                      elif path == '/bookings' and http_method == 'GET':
                          return get_customer_bookings(user_id)
                      elif '/bookings/' in path and path.endswith('/messages') and http_method == 'GET':
                          booking_id = path_params.get('booking_id')
                          return get_booking_messages(booking_id, user_id, user_type)
                      elif '/bookings/' in path and http_method == 'DELETE':
                          booking_id = path_params.get('booking_id')
                          return cancel_booking(booking_id, user_id)
                      elif path == '/customers/profile' and http_method == 'GET':
                          return get_customer_profile(user_id)
                      elif '/bikes/' in path and path.endswith('/feedback') and http_method == 'POST':
                          bike_id = path_params.get('bike_id')
                          return submit_feedback(event, bike_id, user_id)
                      elif '/bikes/' in path and '/feedback/' in path and http_method == 'PUT' and 'feedback_id' in path_params:
                          # NEW: Customer edit feedback - path pattern: /bikes/{bike_id}/feedback/{feedback_id}
                          feedback_id = path_params.get('feedback_id')
                          return edit_customer_feedback(event, feedback_id, user_id)
                      elif path == '/messages' and http_method == 'POST':
                          return send_message(event, user_id, user_type)
                      elif path == '/messages/conversations' and http_method == 'GET':
                          return get_customer_conversations(user_id)

                  # FRANCHISE ENDPOINTS
                  elif user_type == 'franchise':
                      if path == '/bikes' and http_method == 'POST':
                          return create_bike(event, user_id)
                      elif '/bikes/' in path and http_method == 'PUT':
                          bike_id = path_params.get('bike_id')
                          return update_bike(event, bike_id, user_id)
                      elif '/bikes/' in path and http_method == 'DELETE':
                          bike_id = path_params.get('bike_id')
                          return delete_bike(bike_id, user_id)
                      elif path == '/franchise/bookings' and http_method == 'GET':
                          return get_franchise_bookings(user_id, event.get('queryStringParameters', {}))
                      elif '/franchise/bookings/' in path and path.endswith('/messages') and http_method == 'GET':
                          booking_id = path_params.get('booking_id')
                          return get_booking_messages(booking_id, user_id, user_type)
                      elif path == '/franchise/customers' and http_method == 'GET':
                          return get_franchise_customers(user_id)
                      elif path == '/franchise/dashboard' and http_method == 'GET':
                          return get_franchise_dashboard(user_id)
                      elif path == '/franchise/feedback' and http_method == 'GET':
                          # NEW: Get all feedback for franchise
                          return get_franchise_feedback(user_id, event.get('queryStringParameters', {}))
                      elif '/franchise/feedback/' in path and path.endswith('/reply') and http_method == 'POST':
                          # NEW: Franchise reply to feedback
                          feedback_id = path_params.get('feedback_id')
                          return reply_to_feedback(event, feedback_id, user_id)
                      elif '/franchise/feedback/replies/' in path and http_method == 'PUT':
                          # NEW: Franchise edit reply
                          reply_id = path_params.get('reply_id')
                          return edit_franchise_reply(event, reply_id, user_id)
                      elif path == '/messages' and http_method == 'POST':
                          return send_message(event, user_id, user_type)
                      elif path == '/franchise/conversations' and http_method == 'GET':
                          return get_franchise_conversations(user_id)

                  return response_with_cors(404, {'error': 'Endpoint not found or access denied'})

              except Exception as e:
                  print(f"Unified API error: {str(e)}")
                  print(f"Request path: {path}")
                  print(f"HTTP method: {http_method}")
                  print(f"Path parameters: {path_params}")
                  print(f"Traceback: {traceback.format_exc()}")
                  return response_with_cors(500, {'error': 'Internal server error'})

          
          # CUSTOMER FUNCTIONS
          def create_booking(event, customer_id):
              try:
                  body = json.loads(event['body']) if event.get('body') else {}
                  bike_id = body.get('bike_id', '').strip()
                  booking_date = body.get('date', '').strip()
                  
                  if not bike_id or not booking_date:
                      return response_with_cors(400, {'error': 'bike_id and date are required'})
                  
                  # Validate date format and future date
                  try:
                      booking_date_obj = datetime.strptime(booking_date, '%Y-%m-%d')
                      if booking_date_obj.date() < date.today():
                          return response_with_cors(400, {'error': 'Cannot book for past dates'})
                  except ValueError:
                      return response_with_cors(400, {'error': 'Invalid date format. Use YYYY-MM-DD'})
                  
                  # Check if bike exists and is available
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  bike_response = bikes_table.get_item(Key={'bike_id': bike_id})
                  
                  if 'Item' not in bike_response:
                      return response_with_cors(400, {'error': 'Bike not found'})
                  
                  bike = bike_response['Item']
                  if bike.get('status') != 'ACTIVE':
                      return response_with_cors(400, {'error': 'Bike not available'})
                  
                  franchise_id = bike.get('franchise_id')
                  if not franchise_id:
                      return response_with_cors(400, {'error': 'Bike has no assigned franchise'})
                  
                  # Check real-time availability
                  inventory_table = dynamodb.Table(os.environ['BIKE_INVENTORY_TABLE'])
                  inventory_response = inventory_table.get_item(
                      Key={'bike_id': bike_id, 'date': booking_date}
                  )
                  
                  total_count = int(bike['count'])
                  booked_count = 0
                  
                  if 'Item' in inventory_response:
                      booked_count = int(inventory_response['Item'].get('booked_count', 0))
                  
                  if booked_count >= total_count:
                      return response_with_cors(400, {'error': 'Bike unavailable for this date'})
                  
                  # Check for duplicate booking by same customer
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  customer_bookings = bookings_table.query(
                      IndexName='CustomerBookings',
                      KeyConditionExpression=Key('customer_id').eq(customer_id) & Key('date').eq(booking_date),
                      FilterExpression='bike_id = :bike_id AND #status IN (:confirmed, :pending)',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':bike_id': bike_id,
                          ':confirmed': 'CONFIRMED',
                          ':pending': 'PENDING'
                      }
                  )
                  
                  if customer_bookings['Items']:
                      return response_with_cors(400, {'error': 'You already have a booking for this bike and date'})
                  
                  # Create booking with automatic confirmation
                  booking_id = str(uuid.uuid4())
                  access_code = generate_access_code()
                  
                  booking_data = {
                      'booking_id': booking_id,
                      'customer_id': customer_id,
                      'bike_id': bike_id,
                      'franchise_id': franchise_id,
                      'date': booking_date,
                      'status': 'CONFIRMED',  # Automatically confirmed
                      'accessCode': access_code,
                      'dailyRate': bike['dailyRate'],
                      'createdAt': datetime.now().isoformat(),
                      'confirmedAt': datetime.now().isoformat()
                  }
                  
                  # Atomic transaction: Create booking and update inventory
                  try:
                      # Update inventory atomically
                      inventory_table.update_item(
                          Key={'bike_id': bike_id, 'date': booking_date},
                          UpdateExpression='ADD booked_count :inc SET total_count = :total, last_updated = :now',
                          ExpressionAttributeValues={
                              ':inc': 1,
                              ':total': total_count,
                              ':now': datetime.now().isoformat()
                          }
                      )
                      
                      # Create booking
                      bookings_table.put_item(Item=booking_data)
                      
