                      IndexName='FranchiseBookings',
                      KeyConditionExpression=Key('franchise_id').eq(franchise_id)
                  )
                  
                  # Get all bikes for this franchise
                  bikes_response = bikes_table.query(
                      IndexName='FranchiseBikesIndex',
                      KeyConditionExpression=Key('franchise_id').eq(franchise_id)
                  )
                  
                  # Calculate statistics
                  total_bookings = len(bookings_response['Items'])
                  total_revenue = sum(float(booking.get('dailyRate', 0)) for booking in bookings_response['Items'])
                  
                  status_counts = {}
                  monthly_revenue = {}
                  
                  for booking in bookings_response['Items']:
                      # Status counts
                      status = booking['status']
                      status_counts[status] = status_counts.get(status, 0) + 1
                      
                      # Monthly revenue (only for confirmed bookings)
                      if status == 'CONFIRMED':
                          month = booking['date'][:7]  # YYYY-MM
                          monthly_revenue[month] = monthly_revenue.get(month, 0) + float(booking.get('dailyRate', 0))
                  
                  # Bike statistics
                  active_bikes = sum(1 for bike in bikes_response['Items'] if bike.get('status') == 'ACTIVE')
                  total_bike_count = sum(int(bike.get('count', 0)) for bike in bikes_response['Items'] if bike.get('status') == 'ACTIVE')
                  
                  bike_types = {}
                  for bike in bikes_response['Items']:
                      if bike.get('status') == 'ACTIVE':
                          bike_type = bike['type']
                          bike_types[bike_type] = bike_types.get(bike_type, 0) + int(bike.get('count', 0))
                  
                  # Get unique customers
                  unique_customers = len(set(booking['customer_id'] for booking in bookings_response['Items']))
                  
                  # Pending cancellations
                  cancellation_table = dynamodb.Table(os.environ['CANCELLATION_REQUESTS_TABLE'])
                  pending_cancellations = cancellation_table.query(
                      IndexName='FranchiseCancellations',
                      KeyConditionExpression=Key('franchise_id').eq(franchise_id),
                      FilterExpression='#status = :status',
                      ExpressionAttributeNames={'#status': 'status'},
