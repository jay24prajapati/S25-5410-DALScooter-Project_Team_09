          def approve_booking(booking_id, franchise_id):
              try:
                  if not booking_id:
                      return response_with_cors(400, {'error': 'booking_id is required'})
                  
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  
                  if 'Item' not in booking_response:
                      return response_with_cors(404, {'error': 'Booking not found'})
                  
                  booking = booking_response['Item']
                  
                  # Verify franchise owns the bike
                  if booking.get('franchise_id') != franchise_id:
                      return response_with_cors(403, {'error': 'Access denied'})
                  
                  if booking['status'] != 'PENDING':
                      return response_with_cors(400, {'error': f'Cannot approve booking with status: {booking["status"]}'})
                  
                  # Check bike availability again
                  bikes_table = dynamodb.Table(os.environ['BIKES_TABLE'])
                  bike_response = bikes_table.get_item(Key={'bike_id': booking['bike_id']})
                  
                  if 'Item' not in bike_response:
                      return response_with_cors(400, {'error': 'Associated bike not found'})
                  
                  bike = bike_response['Item']
                  existing_bookings = bookings_table.query(
                      IndexName='BikeBookings',
                      KeyConditionExpression=Key('bike_id').eq(booking['bike_id']) & Key('date').eq(booking['date']),
                      FilterExpression='#status IN (:confirmed, :pending)',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':confirmed': 'CONFIRMED',
                          ':pending': 'PENDING'
                      }
                  )
                  
                  booked_count = len(existing_bookings['Items'])
                  if booked_count > int(bike['count']):
                      return response_with_cors(400, {'error': 'Bike no longer available'})
                  
                  # Approve booking
                  access_code = booking.get('accessCode') or generate_access_code()
                  
                  bookings_table.update_item(
                      Key={'booking_id': booking_id},
                      UpdateExpression='SET #status = :status, accessCode = :code, approvedAt = :approved',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'CONFIRMED',
                          ':code': access_code,
                          ':approved': datetime.now().isoformat()
                      }
                  )
                  
                  # Send notification to customer
                  send_notification(
                      topic_arn=os.environ['CUSTOMER_NOTIFICATIONS_TOPIC'],
                      message=f"Your booking {booking_id} has been approved. Access code: {access_code}",
                      subject="Booking Approved"
                  )
                  
                  return response_with_cors(200, {
                      'message': 'Booking approved successfully',
                      'accessCode': access_code
                  })
              except Exception as e:
                  print(f"Error approving booking: {str(e)}")
                  return response_with_cors(500, {'error': 'Booking approval failed'})
          
