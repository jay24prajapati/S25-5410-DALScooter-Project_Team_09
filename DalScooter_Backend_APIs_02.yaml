          def get_franchise_customers(franchise_id):
              try:
                  # Get unique customers who have bookings for this franchise
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  bookings_response = bookings_table.query(
                      IndexName='FranchiseBookings',
                      KeyConditionExpression=Key('franchise_id').eq(franchise_id)
                  )
                  
                  unique_customers = {}
                  for booking in bookings_response['Items']:
                      customer_id = booking['customer_id']
                      if customer_id not in unique_customers:
                          unique_customers[customer_id] = {
                              'customer_id': customer_id,
                              'totalBookings': 0,
                              'firstBooking': booking['date'],
                              'lastBooking': booking['date'],
                              'totalRevenue': 0,
                              'statuses': {}
                          }
                      
                      customer_data = unique_customers[customer_id]
                      customer_data['totalBookings'] += 1
                      customer_data['totalRevenue'] += float(booking.get('dailyRate', 0))
                      
                      # Track date range
                      if booking['date'] < customer_data['firstBooking']:
                          customer_data['firstBooking'] = booking['date']
                      if booking['date'] > customer_data['lastBooking']:
                          customer_data['lastBooking'] = booking['date']
                      
                      # Track booking statuses
                      status = booking['status']
                      customer_data['statuses'][status] = customer_data['statuses'].get(status, 0) + 1
                  
                  # Get customer details
                  users_table = dynamodb.Table(os.environ['USERS_TABLE'])
                  customers = []
                  
                  for customer_id, customer_data in unique_customers.items():
                      user_response = users_table.get_item(Key={'userId': customer_id})
                      user_info = user_response.get('Item', {})
                      
                      customers.append({
                          'customer_id': customer_id,
                          'email': user_info.get('email', 'N/A'),
                          'registrationDate': user_info.get('registrationDate'),
                          'totalBookings': customer_data['totalBookings'],
                          'totalRevenue': customer_data['totalRevenue'],
                          'firstBooking': customer_data['firstBooking'],
                          'lastBooking': customer_data['lastBooking'],
                          'bookingStatuses': customer_data['statuses']
                      })
                  
                  # Sort by total revenue descending
                  customers.sort(key=lambda x: x['totalRevenue'], reverse=True)
                  
                  return response_with_cors(200, {
                      'customers': customers,
                      'total': len(customers)
                  })
                  
              except Exception as e:
                  print(f"Error getting franchise customers: {str(e)}")
