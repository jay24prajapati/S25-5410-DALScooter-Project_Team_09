                  bike = bike_response['Item']
                  if bike.get('franchise_id') != franchise_id:
                      return response_with_cors(403, {'error': 'Access denied'})
                  
                  # Check for future active bookings
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  today_str = date.today().isoformat()
                  
                  future_bookings = bookings_table.scan(
                      FilterExpression='bike_id = :bike_id AND #date >= :today AND #status = :status',
                      ExpressionAttributeNames={'#date': 'date', '#status': 'status'},
                      ExpressionAttributeValues={
                          ':bike_id': bike_id,
                          ':today': today_str,
                          ':status': 'CONFIRMED'
                      }
                  )
                  
                  if future_bookings['Items']:
                      return response_with_cors(400, {
                          'error': 'Cannot delete bike with future active bookings',
                          'active_bookings': len(future_bookings['Items'])
                      })
                  
                  # Mark bike as inactive instead of deleting
                  bikes_table.update_item(
                      Key={'bike_id': bike_id},
                      UpdateExpression='SET #status = :status, deletedAt = :deleted',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'INACTIVE',
                          ':deleted': datetime.now().isoformat()
                      }
                  )
                  
                  send_inventory_update({
                      'type': 'bike_deleted',
                      'bike_id': bike_id,
                      'franchise_id': franchise_id
                  })
                  
                  return response_with_cors(200, {'message': 'Bike deleted successfully'})
                  
