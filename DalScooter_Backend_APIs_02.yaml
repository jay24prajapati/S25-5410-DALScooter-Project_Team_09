          def approve_cancellation(booking_id, franchise_id):
              try:
                  if not booking_id:
                      return response_with_cors(400, {'error': 'booking_id is required'})
                  
                  # Verify booking and cancellation request
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
                  booking_response = bookings_table.get_item(Key={'booking_id': booking_id})
                  
                  if 'Item' not in booking_response:
                      return response_with_cors(404, {'error': 'Booking not found'})
                  
                  booking = booking_response['Item']
                  
                  if booking.get('franchise_id') != franchise_id:
                      return response_with_cors(403, {'error': 'Access denied'})
                  
                  if booking['status'] != 'CANCELLATION_PENDING':
                      return response_with_cors(400, {'error': 'No pending cancellation request for this booking'})
                  
                  # Update booking status
                  bookings_table.update_item(
                      Key={'booking_id': booking_id},
                      UpdateExpression='SET #status = :status, cancelledAt = :cancelled, cancellationReason = :reason',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'CANCELLED',
                          ':cancelled': datetime.now().isoformat(),
                          ':reason': 'Approved by franchise'
                      }
                  )
                  
                  # Update cancellation request
                  cancellation_table = dynamodb.Table(os.environ['CANCELLATION_REQUESTS_TABLE'])
                  cancellation_response = cancellation_table.scan(
                      FilterExpression='booking_id = :booking_id AND #status = :status',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':booking_id': booking_id,
                          ':status': 'PENDING'
                      }
                  )
                  
                  if cancellation_response['Items']:
                      cancellation = cancellation_response['Items'][0]
                      cancellation_table.update_item(
                          Key={'cancellation_id': cancellation['cancellation_id']},
                          UpdateExpression='SET #status = :status, processedAt = :processed, processedBy = :processed_by',
                          ExpressionAttributeNames={'#status': 'status'},
                          ExpressionAttributeValues={
                              ':status': 'APPROVED',
                              ':processed': datetime.now().isoformat(),
                              ':processed_by': franchise_id
                          }
                      )
                  
                  # Send notification to customer
                  send_notification(
                      topic_arn=os.environ['CUSTOMER_NOTIFICATIONS_TOPIC'],
                      message=f"Your cancellation request for booking {booking_id} has been approved.",
                      subject="Cancellation Approved"
                  )
                  
                  return response_with_cors(200, {'message': 'Cancellation approved successfully'})
              except Exception as e:
                  print(f"Error approving cancellation: {str(e)}")
                  return response_with_cors(500, {'error': 'Cancellation approval failed'})
          
          def reject_cancellation(booking_id, franchise_id):
              try:
                  if not booking_id:
                      return response_with_cors(400, {'error': 'booking_id is required'})
                  
                  # Verify booking and cancellation request
                  bookings_table = dynamodb.Table(os.environ['BOOKINGS_TABLE'])
