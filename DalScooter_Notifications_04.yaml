          """
                  
                  # Send notification to user's personal topic
                  response = sns.publish(
                      TopicArn=topic_arn,
                      Message=message,
                      Subject=subject
                  )
                  
                  print(f"Booking cancellation sent to personal topic. MessageId: {response['MessageId']}")
